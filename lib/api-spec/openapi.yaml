        points: { type: array, items: { $ref: "#/components/schemas/EngagementTrendPoint" } }
    HqAuditEvent:
      type: object
      required: [id, occurredAt, action, actorUserId, actorKind, actorName, providerId, officeName, targetKind, targetId, targetName, requestId, metadata]
      properties:
        id: { type: number }
