        patients_with_meal_log: { type: number }
        patients_with_check_in: { type: number }
        patients_with_water: { type: number }
        patients_with_photo: { type: number }
        patients_with_weight: { type: number }
        meal_logs: { type: number }
        check_ins: { type: number }
    EngagementTrendResult:
      type: object
