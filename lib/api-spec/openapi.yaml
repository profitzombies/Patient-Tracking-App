      operationId: requestExport
      tags: [exports]
      summary: Queue a CSV export scoped to the caller's permissions and office
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequestInput" }
      responses:
        "202":
          description: Export queued
          content: { application/json: { schema: { $ref: "#/components/schemas/ExportJobResult" } } }
        "400": { description: Invalid kind or office or range }
        "403": { description: Export kind not allowed for this role or scope }
        "429": { description: Too many exports in progress }
  /exports/{exportId}:
    get:
      operationId: getExport
      tags: [exports]
      summary: Poll one of the caller's export jobs
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Job state
          content: { application/json: { schema: { $ref: "#/components/schemas/ExportJobResult" } } }
        "404": { description: Not the caller's export }
  /exports/{exportId}/download-url:
    get:
      operationId: getExportDownloadUrl
      tags: [exports]
      summary: Mint a short-lived signed download link for a ready export
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Signed link
          content: { application/json: { schema: { $ref: "#/components/schemas/ExportDownloadResult" } } }
        "404": { description: Not the caller's export }
        "409": { description: Export not ready }
        "410": { description: Export expired }
  /hq/overview:
    get:
      operationId: getHqOverview
      tags: [hq]
      summary: Read aggregate-only operational metrics across the HQ umbrella
      responses:
        "200":
          description: Zero-safe umbrella rollup with no raw patient rows
          content: { application/json: { schema: { $ref: "#/components/schemas/OperationalRollupResult" } } }
  /hq/settings:
    get:
      operationId: getHqSettings
      tags: [hq]
      summary: Read the persisted organization settings and policy contract
      responses:
        "200":
          description: Organization settings with per-section last-changed metadata
          content: { application/json: { schema: { $ref: "#/components/schemas/HqOrganizationSettings" } } }
    put:
      operationId: updateHqSettings
      tags: [hq]
      summary: Update organization settings and policies
      description: >-
        Merge update: fields left out keep their current values, so a client
        may save one section at a time. Every changed field is audited with
        field-level metadata (section, from, to) and bumps the settings
        version; pass expectedVersion to refuse overwriting a newer save.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HqOrganizationSettingsInput" }
      responses:
        "200":
          description: Updated organization settings
          content: { application/json: { schema: { $ref: "#/components/schemas/HqOrganizationSettings" } } }
        "400": { description: Invalid settings }
        "409": { description: Settings changed since expectedVersion }
  /office/settings:
    get:
      operationId: getOfficeSettings
      tags: [office]
      summary: Read the effective policy for an office with its permitted overrides
      parameters:
        - $ref: "#/components/parameters/OfficeId"
      responses:
        "200":
          description: HQ policy, the office's overrides, and the effective values
          content: { application/json: { schema: { $ref: "#/components/schemas/OfficeSettings" } } }
        "404": { description: Office unavailable }
  /office/files:
    get:
      operationId: getOfficeFiles
      tags: [office]
      summary: Read one folder of the HQ file drive as a provider (read-only; archived files never appear)
      description: >-
        Provider staff of every office role see the whole HQ drive but can only
        browse, search, preview and download. Uploads, renames, moves, archive
        and delete exist only on the HQ routes. HQ drill-ins must hold
        settings_manage, the same permission that gates the HQ drive itself.
      parameters:
        - $ref: "#/components/parameters/OfficeId"
        - { name: folderId, in: query, required: false, schema: { type: string }, description: Folder to list; omit for the root }
      responses:
        "200":
          description: The folder, its breadcrumb trail, child folders A-Z and active files newest first
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFileListResult" } } }
        "404": { description: Folder not found }
  /office/files/search:
    get:
      operationId: searchOfficeFiles
      tags: [office]
      summary: Search active HQ files by name as a provider
      parameters:
        - $ref: "#/components/parameters/OfficeId"
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 120 }, description: Case-insensitive substring of the file name }
      responses:
        "200":
          description: Up to 50 matches, best match first
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFileSearchResult" } } }
  /office/files/{fileId}/content:
