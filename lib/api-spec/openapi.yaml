      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
        - { name: before, in: query, schema: { type: number, minimum: 1 } }
        - { name: after, in: query, schema: { type: number, minimum: 1 } }
        - { name: limit, in: query, schema: { type: number, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Chronological events with nullable cursors
          content: { application/json: { schema: { $ref: "#/components/schemas/HqConversationEventsResult" } } }
        "404": { description: Conversation unavailable }
  /hq/conversations/{conversationId}/notes:
    get:
      operationId: getHqConversationNotes
      tags: [hq]
      summary: Read permission-scoped internal notes
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Notes, oldest first
          content: { application/json: { schema: { $ref: "#/components/schemas/ConversationNotesResult" } } }
        "404": { description: Conversation unavailable }
  /hq/conversations/{conversationId}/read:
    post:
      operationId: readHqConversation
      tags: [hq]
      summary: Advance only the HQ viewer's private read high-water mark
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationReadInput" }
      responses:
        "200":
          description: Idempotent read position result
          content: { application/json: { schema: { $ref: "#/components/schemas/ConversationReadResult" } } }
        "404": { description: Conversation unavailable }
  /hq/escalations:
    get:
      operationId: getHqEscalations
      tags: [hq]
      summary: HQ escalation queue, limited to the departments the caller's role may handle
      parameters:
        - { name: department, in: query, schema: { type: string, enum: [clinical, support] } }
