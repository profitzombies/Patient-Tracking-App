      summary: Inbox header metrics for an authorized office (open threads, unanswered, response time)
      parameters:
        - $ref: "#/components/parameters/OfficeId"
      responses:
        "200":
          description: Office-wide inbox metrics
          content: { application/json: { schema: { $ref: "#/components/schemas/InboxMetricsResult" } } }
        "404": { description: Office unavailable }
  /office/conversations/staff:
    get:
      operationId: getOfficeConversationStaff
      tags: [office]
      summary: Staff members a conversation in this office can be assigned to
      parameters:
        - $ref: "#/components/parameters/OfficeId"
      responses:
        "200":
          description: Assignable office staff
          content: { application/json: { schema: { $ref: "#/components/schemas/ConversationStaffResult" } } }
        "404": { description: Office unavailable }
  /office/conversations/{conversationId}/events:
    get:
      operationId: getOfficeConversationEvents
