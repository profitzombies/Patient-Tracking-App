      operationId: getOfficeFileContent
      tags: [office]
      summary: Stream an active HQ file inline for in-app preview (provider read)
      parameters:
        - $ref: "#/components/parameters/OfficeId"
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Stored bytes with the file's content type
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { description: File not found or archived }
        "410": { description: Stored bytes are missing }
  /office/files/{fileId}/download-url:
    get:
      operationId: getOfficeFileDownload
      tags: [office]
      summary: Mint a short-lived download URL for an active HQ file (provider read; audited)
      parameters:
        - $ref: "#/components/parameters/OfficeId"
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Signed private download
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFileDownloadResult" } } }
        "404": { description: File not found or archived }
        "410": { description: Stored bytes are missing }
  /office/settings/overrides:
    put:
      operationId: updateOfficeSettingsOverrides
      tags: [office]
      summary: Replace the office-local overrides HQ marks overridable
      parameters:
        - $ref: "#/components/parameters/OfficeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfficeOverridesInput" }
      responses:
        "200":
          description: Updated office settings
          content: { application/json: { schema: { $ref: "#/components/schemas/OfficeSettings" } } }
        "400": { description: Invalid overrides }
        "404": { description: Office unavailable }
        "409": { description: Overrides changed since expectedVersion }
        "423": { description: Office locked }
  /hq/files/upload-url:
    post:
      operationId: createHqFileUpload
      tags: [hq]
      summary: Mint a private App Storage upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HqFileUploadInput" }
      responses:
        "200":
          description: Short-lived PUT URL and server-owned object path
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFileUploadResult" } } }
        "413": { description: File too large }
        "415": { description: Content type not accepted }
  /hq/files:
    get:
      operationId: getHqFiles
      tags: [hq]
      summary: List one folder of the private HQ file drive (root when folderId is omitted), or the archived files
      parameters:
        - { name: folderId, in: query, required: false, schema: { type: string }, description: Folder to list; omit for the root }
        - { name: view, in: query, required: false, schema: { type: string, enum: [active, archived] }, description: Pass archived to list every archived file with its original folder path instead of a folder; folderId is then ignored }
      responses:
        "200":
          description: The folder, its breadcrumb trail, child folders and files in their saved manual order (items never ordered come first, folders A-Z and files newest first)
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFileListResult" } } }
        "404": { description: Folder not found }
    post:
      operationId: finalizeHqFile
      tags: [hq]
      summary: Verify uploaded bytes and persist file metadata
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HqFileFinalizeInput" }
      responses:
        "200":
          description: Persisted file
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFile" } } }
        "404": { description: Uploaded object not found }
        "422": { description: Stored object metadata does not match }
  /hq/files/search:
    get:
      operationId: searchHqFiles
      tags: [hq]
      summary: Search active (non-archived) files by name across every folder
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 120 }, description: Case-insensitive substring of the file name }
      responses:
        "200":
          description: Up to 50 matches, best match first (name starts with the query, then contains it; newest first within a tier)
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFileSearchResult" } } }
  /hq/files/order:
    put:
      operationId: reorderHqDrive
      tags: [hq]
      summary: Save the manual display order of the folders and/or files directly inside one folder (root when parentId is null)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HqDriveOrderInput" }
      responses:
        "200":
          description: Order saved
          content: { application/json: { schema: { $ref: "#/components/schemas/HqDriveOrderResult" } } }
        "404": { description: Parent folder not found }
        "409": { description: The listing changed underneath the caller (an id is no longer an active child of parentId); reload and retry }
  /hq/files/{fileId}/content:
    get:
      operationId: getHqFileContent
      tags: [hq]
      summary: Stream the stored bytes inline for in-app preview (bearer-authenticated, Content-Disposition inline)
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Stored bytes with the file's content type
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { description: File not found }
        "410": { description: Stored bytes are missing }
  /hq/files/{fileId}/replace-url:
    post:
      operationId: createHqFileReplacement
      tags: [hq]
      summary: Mint an upload URL for a new version of an existing file (same entry, new bytes)
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HqFileReplaceUploadInput" }
      responses:
        "200":
          description: Short-lived PUT URL and a fresh server-owned object path (fileId echoes the existing file)
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFileUploadResult" } } }
        "404": { description: File not found }
        "413": { description: File too large }
        "415": { description: Content type not accepted }
  /hq/files/{fileId}/replace:
    post:
      operationId: replaceHqFile
      tags: [hq]
      summary: Verify the replacement bytes, swap them in, and delete the previous version
      description: The entry keeps its id, folder, and (when the new bytes have the same extension) its name; a different extension takes the uploaded file's name. Size, type, compression fields, and the unavailable flag are recomputed.
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HqFileReplaceInput" }
      responses:
        "200":
          description: Updated file
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFile" } } }
        "404": { description: File or uploaded object not found }
        "422": { description: Stored object metadata does not match }
  /hq/files/{fileId}/download-url:
    get:
      operationId: getHqFileDownload
      tags: [hq]
      summary: Mint a short-lived private download URL
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Signed private download
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFileDownloadResult" } } }
        "404": { description: File not found }
  /hq/files/{fileId}:
    patch:
      operationId: updateHqFile
      tags: [hq]
      summary: Rename a file, move it to another folder, and/or archive or restore it
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HqFileUpdateInput" }
      responses:
        "200":
          description: Updated file
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFile" } } }
        "404": { description: File or destination folder not found }
        "415": { description: New name's extension does not match the file type }
    delete:
      operationId: deleteHqFile
      tags: [hq]
      summary: Delete private bytes and metadata
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: File deleted
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFileDeleteResult" } } }
        "404": { description: File not found }
  /hq/folders:
    post:
      operationId: createHqFolder
      tags: [hq]
      summary: Create a folder (nested when parentId is given)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HqFolderCreateInput" }
      responses:
        "200":
          description: Created folder
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFolder" } } }
        "404": { description: Parent folder not found }
        "409": { description: A folder with that name already exists here }
        "422": { description: Folders can nest at most 10 levels deep }
  /hq/folders/{folderId}:
    patch:
      operationId: updateHqFolder
      tags: [hq]
      summary: Rename a folder and/or move it under another folder
      parameters:
        - { name: folderId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HqFolderUpdateInput" }
      responses:
        "200":
          description: Updated folder
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFolder" } } }
        "404": { description: Folder or destination not found }
        "409": { description: A folder with that name already exists at the destination }
        "422": { description: Cannot move a folder into itself or its descendants or past 10 levels }
    delete:
      operationId: deleteHqFolder
      tags: [hq]
      summary: Delete a folder with every file and sub-folder inside it
      parameters:
        - { name: folderId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Folder tree deleted
          content: { application/json: { schema: { $ref: "#/components/schemas/HqFolderDeleteResult" } } }
        "404": { description: Folder not found }
  /hq/system-health:
    get:
      operationId: getHqSystemHealth
      tags: [hq]
      summary: Background clean-up jobs with their health, last runs, and recent item failures
      responses:
        "200":
          description: System health snapshot
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemHealthResult" } } }
  /hq/system-health/runs/{runId}:
    get:
      operationId: getHqSystemJobRun
      tags: [hq]
      summary: One job run (used to poll a manual run that is still going)
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The run
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemJobRunResult" } } }
        "404": { description: Unknown run }
  /hq/system-health/jobs/{name}/run:
    post:
      operationId: runHqSystemJob
      tags: [hq]
      summary: Run one background job now (optionally as a dry run)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunSystemJobBody" }
      responses:
        "200":
          description: The finished run
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemJobRunResult" } } }
        "202":
          description: Still running; poll the health endpoint
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemJobStartedResult" } } }
        "404": { description: Unknown job }
        "409": { description: Already running or not runnable on demand }
  /hq/audit-events:
    get:
      operationId: getHqAuditEvents
      tags: [hq]
      parameters:
        - { name: limit, in: query, schema: { type: number } }
        - { name: offset, in: query, schema: { type: number } }
        - { name: provider, in: query, description: "Office (provider) id chosen from the office picker", schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Paginated allowlisted administrative audit events
          content: { application/json: { schema: { $ref: "#/components/schemas/HqAuditEventsResult" } } }
  /hq/patient-deletions:
    get:
      operationId: getHqPatientDeletions
      tags: [hq]
      summary: Patient-requested account deletions across the network, with purge progress and failures surfaced for HQ
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, cancelled, purging, purged, failed] } }
        - { name: limit, in: query, schema: { type: number } }
      responses:
        "200":
          description: Deletion requests newest first plus a status summary
          content: { application/json: { schema: { $ref: "#/components/schemas/HqPatientDeletionsResult" } } }
  /hq/patient-deletions/{id}/retry:
    post:
      operationId: retryHqPatientDeletion
      tags: [hq]
      summary: Re-queue a failed purge (idempotent; only failed requests can be retried)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The request back in the purge queue
          content: { application/json: { schema: { $ref: "#/components/schemas/HqPatientDeletionResult" } } }
        "404": { description: Deletion request not found }
        "409": { description: Only a failed purge can be retried }
  /bloodwork/patients/{patientId}/reports:
    get:
      operationId: listBloodworkReports
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
        - { $ref: "#/components/parameters/OfficeId" }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Private metadata-only report history
          headers: { Cache-Control: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkReportList" } } }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, account, or office access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "404": { description: Patient unavailable }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
    post:
      operationId: createBloodworkReport
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkReportInput" } } }
      responses:
        "201":
          description: Staged upload grants
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkUploadSet" } } }
        "200":
          description: Idempotently resumed upload grants
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkUploadSet" } } }
        "409": { description: Client request key conflicts }
        "413": { description: File or count limit exceeded }
        "422": { description: Invalid manifest }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, or account access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "404": { description: Patient unavailable }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
  /bloodwork/patients/{patientId}/reports/{reportId}:
    get:
      operationId: getBloodworkReport
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
        - { $ref: "#/components/parameters/BloodworkReportId" }
        - { $ref: "#/components/parameters/OfficeId" }
      responses:
        "200":
          description: Report, files, and structured results
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkDetail" } } }
        "404": { description: Report not found }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, or account access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
    patch:
      operationId: updateBloodworkReport
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
        - { $ref: "#/components/parameters/BloodworkReportId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkReportUpdate" } } }
      responses:
        "200":
          description: Updated report
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkReport" } } }
        "409": { description: Version conflict }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, or account access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
    delete:
      operationId: deleteBloodworkReport
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
        - { $ref: "#/components/parameters/BloodworkReportId" }
        - { name: expectedVersion, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: Tombstoned
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkDeleteResult" } } }
        "409": { description: Version conflict }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, or account access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
  /bloodwork/patients/{patientId}/reports/{reportId}/commit:
    post:
      operationId: commitBloodworkReport
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
        - { $ref: "#/components/parameters/BloodworkReportId" }
      responses:
        "200":
          description: Atomically committed report
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkDetail" } } }
        "413": { description: Stored file exceeds limit }
        "422": { description: "Corrupt, unsupported, or incomplete upload" }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, or account access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "404": { description: Report or patient not found }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
  /bloodwork/patients/{patientId}/reports/{reportId}/retry-extraction:
    post:
      operationId: retryBloodworkExtraction
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
        - { $ref: "#/components/parameters/BloodworkReportId" }
        - { $ref: "#/components/parameters/OfficeId" }
      responses:
        "200":
          description: Failed extraction queued again
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkReport" } } }
        "409": { description: Extraction is not failed }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, or account access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "404": { description: Patient or report not found }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
  /bloodwork/patients/{patientId}/reports/{reportId}/files/{fileId}/source:
    get:
      operationId: getBloodworkFileSource
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
        - { $ref: "#/components/parameters/BloodworkReportId" }
        - { $ref: "#/components/parameters/BloodworkFileId" }
        - { $ref: "#/components/parameters/OfficeId" }
      responses:
        "200":
          description: Authenticated original document bytes
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { description: File not found }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, or account access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
  /bloodwork/patients/{patientId}/reports/{reportId}/files/{fileId}/pages/{page}:
    get:
      operationId: getBloodworkFilePage
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
        - { $ref: "#/components/parameters/BloodworkReportId" }
        - { $ref: "#/components/parameters/BloodworkFileId" }
        - { name: page, in: path, required: true, schema: { type: number, minimum: 1 } }
        - { $ref: "#/components/parameters/OfficeId" }
      responses:
        "200":
          description: Authenticated rendered page bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { description: Page not found }
        "422": { description: Document cannot be rendered }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, or account access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
  /bloodwork/patients/{patientId}/reports/{reportId}/results/{resultId}:
    put:
      operationId: correctBloodworkResult
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
        - { $ref: "#/components/parameters/BloodworkReportId" }
        - { $ref: "#/components/parameters/BloodworkResultId" }
        - { $ref: "#/components/parameters/OfficeId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkResultUpdate" } } }
      responses:
        "200":
          description: Corrected transcription
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkResult" } } }
        "409": { description: Version conflict }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, or account access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
  /bloodwork/patients/{patientId}/reports/{reportId}/results/{resultId}/corrections:
    get:
      operationId: listBloodworkCorrections
      tags: [bloodwork]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfficePatientId" }
        - { $ref: "#/components/parameters/BloodworkReportId" }
        - { $ref: "#/components/parameters/BloodworkResultId" }
        - { $ref: "#/components/parameters/OfficeId" }
      responses:
        "200":
          description: Private correction history
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkCorrectionList" } } }
        "401":
          description: Session required
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "403":
          description: Patient setup, consent, or account access is unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
        "404": { description: Patient or result not found }
        "503":
          description: Account or bloodwork lookup unavailable
          content: { application/json: { schema: { $ref: "#/components/schemas/BloodworkAccessError" } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    BloodworkAccessError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
