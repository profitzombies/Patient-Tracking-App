        - { name: patientId, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { type: string, enum: [all, care_team, ai], default: all } }
        - { name: thread, in: query, schema: { type: string, enum: [coach, support, care_team] } }
        - { name: status, in: query, schema: { type: string, enum: [open, waiting_patient, closed] } }
        - { name: assignee, in: query, schema: { type: string, maxLength: 80 } }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, waiting_longest, unread_first], default: newest } }
        - { name: limit, in: query, schema: { type: number, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: number, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Paginated, permission-scoped HQ summaries
          content: { application/json: { schema: { $ref: "#/components/schemas/HqConversationSummaryResult" } } }
  /hq/conversations/{conversationId}/events:
    get:
      operationId: getHqConversationEvents
      tags: [hq]
