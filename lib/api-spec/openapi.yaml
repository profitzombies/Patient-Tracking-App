      properties:
        familyKey: { type: string }
        summary: { type: string }
        dimensions:
          type: object
          additionalProperties: { type: string }
    FoodNutritionSelection:
      type: object
      additionalProperties: false
      required: [amount, unitId, scale]
      properties:
        amount: { type: number }
        unitId: { type: string }
        scale: { type: number }
    FoodNutritionSnapshot:
      type: object
      additionalProperties: false
      required: [version, source, basis, nutrients, portions, selected, provenance]
      properties:
        version:
          type: integer
          enum: [1]
        source: { $ref: "#/components/schemas/FoodNutritionSource" }
        basis: { $ref: "#/components/schemas/FoodNutritionBasis" }
        nutrients:
          type: array
          items: { $ref: "#/components/schemas/FoodNutritionNutrient" }
        portions:
          type: array
          items: { $ref: "#/components/schemas/FoodNutritionPortion" }
        variant: { $ref: "#/components/schemas/FoodNutritionVariant" }
        selected: { $ref: "#/components/schemas/FoodNutritionSelection" }
        provenance:
          type: string
          enum: [generic_source, generic_dish_estimate, identified_product, personal_label]
    CatalogApproval:
      type: object
      required: [id, name, portion, phaseGuidance, constraints]
      properties:
        id: { type: string }
        name: { type: string }
        portion:
          type: ["string", "null"]
          description: Verbatim official portion; null when the source does not state one
        phaseGuidance:
          type: ["string", "null"]
          description: Verbatim phase guidance; null when the source does not state one
        constraints:
          type: ["object", "null"]
          additionalProperties: true
          description: Reviewed structured eligibility constraints; null when none apply
    CatalogFood:
      type: object
      required: [id, kind, name, brand, serving, servingGrams, calories, protein, carbs, fat, measures, source, sourceId, barcode, qualityStatus, approvals]
      properties:
        id: { type: string }
        kind: { type: string, enum: [generic, branded, personal] }
        name: { type: string }
        canonicalName:
          type: string
          description: Original source description when name is a reviewed patient-friendly label
        brand: { type: ["string", "null"] }
        serving: { type: string }
        servingGrams: { type: ["number", "null"] }
        calories: { type: number }
        protein: { type: number }
        carbs: { type: number }
        fat: { type: number }
        measures:
          type: array
          items:
            type: object
            additionalProperties: true
        source: { type: string, enum: [usda_fdc, openfoodfacts, patient] }
        sourceId: { type: string }
        barcode: { type: ["string", "null"] }
        qualityStatus: { type: string, enum: [reviewed, community_verified, community, private] }
        approvals:
          type: array
          items: { $ref: "#/components/schemas/CatalogApproval" }
        resultKey: { type: string }
        familyKey: { type: string }
        familyKeyAliases:
          type: array
          items: { type: string }
          description: Legacy family keys that redirect to this result's canonical familyKey
        variantSummary: { type: string }
        dimensions:
          type: object
          additionalProperties: { type: string }
        choiceRequired: { type: boolean }
        nutritionSnapshot: { $ref: "#/components/schemas/FoodNutritionSnapshot" }
        catalogMetadata:
          type: object
          additionalProperties: true
          description: Private saved-food catalog provenance and configuration metadata
    CatalogSearchResult:
      type: object
