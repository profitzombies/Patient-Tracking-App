        - { name: before, in: query, schema: { type: number, minimum: 1 } }
        - { name: after, in: query, schema: { type: number, minimum: 1 } }
        - { name: limit, in: query, schema: { type: number, minimum: 1, maximum: 100, default: 50 } }
      responses:
