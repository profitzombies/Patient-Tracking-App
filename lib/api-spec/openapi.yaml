openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: coach
    description: AI coach chat for patients
paths:
  /coach/chat:
    post:
      operationId: coachChat
      tags: [coach]
      summary: Stream an AI coach reply for a patient chat turn
      description: >-
        Stateless SSE endpoint. The client sends its in-session message history
        and receives a text/event-stream of assistant chunks
        ("data: {\"content\": \"...\"}" lines followed by
        "data: {\"done\": true}"), optionally with one
        "data: {\"card\": {\"kind\", \"payload\"}}" event before done.
        Card kinds: "product" — a curated THINNR product suggestion
        ({\"id\", \"name\", \"line\", \"price\"}); "recipe" — a structured
        recipe suggestion emitted on meal-idea and craving turns, whose
        ingredients in cravings mode are validated server-side against the
        official Approved Foods list. Patient program context is derived
        server-side from the demo seed; rate limits apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachChatInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid request body
        "429":
          description: Rate limited
  /coach/recipe-image:
    post:
      operationId: coachRecipeImage
      tags: [coach]
      summary: Generate a dish photo for an AI-suggested recipe
      description: >-
        Generates a single appetizing dish photo for a coach recipe suggestion
        and returns it as a JPEG data URI, small enough for the client to
        persist alongside a saved recipe. Rate limited separately from chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachRecipeImageInput"
      responses:
        "200":
          description: Generated photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeImageResult"
        "400":
          description: Invalid request body
        "429":
          description: Rate limited
        "502":
          description: Image generation failed
  /coach/menu-scan:
    post:
      operationId: coachMenuScan
      tags: [coach]
      summary: Scan a restaurant menu photo for THINNR-compatible orders
      description: >-
        Analyzes one menu photo with the coach's vision model, grounded in the
        verbatim Approved Foods list and the restaurant guide's ordering
        rules, and returns structured AI guidance: dishes on that menu that
        can work (each with the exact modification to request), dishes to
        avoid, or a signal that the photo is not a readable menu. The photo is
        analyzed in memory only and never stored server-side. This route
        accepts a larger JSON body than the rest of the API (photo payload)
        and is rate limited separately from chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachMenuScanInput"
      responses:
        "200":
          description: Structured scan result (AI guidance, not program copy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMenuScanResult"
        "400":
          description: Invalid request body or unsupported photo format
        "413":
          description: Photo payload too large
        "429":
          description: Rate limited
        "502":
          description: Menu scan failed
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CoachChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 4000
        stopped:
          type: boolean
          description: >-
            True when the patient stopped this assistant reply mid-stream, so
            its text is an incomplete fragment. The server annotates flagged
            replies before replaying them to the model, keeping the next
            answer from continuing the cut-off sentence. Ignored on user
            messages.
        image:
          type: string
          maxLength: 8000000
          description: >-
            Optional menu photo attached to this user message, as a base64
            data URI (JPEG, PNG, or WebP). Honored only on the final message
            of the request — history replays carry text only, so a photo is
            never re-sent on later turns. Analyzed in memory and never
            stored. Ignored on assistant messages.
      required:
        - role
        - content
    CoachChatInput:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CoachChatMessage"
          minItems: 1
          maxItems: 30
      required:
        - messages
    CoachRecipeImageInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 200
      required:
        - name
    CoachRecipeImageResult:
      type: object
      properties:
        image:
          type: string
          description: JPEG photo as a data URI
      required:
        - image
    CoachMenuScanInput:
      type: object
      properties:
        image:
          type: string
          description: >-
            Menu photo as a base64 data URI (image/jpeg, image/png, or
            image/webp), downscaled and compressed client-side before upload.
          maxLength: 8000000
      required:
        - image
    CoachMenuScanOrderItem:
      type: object
      properties:
        name:
          type: string
          description: Dish name as printed on the menu
        howToOrder:
          type: string
          description: >-
            Plain-language request to the server covering every needed
            modification (e.g. grilled plain, no butter or oil, sauce off)
        note:
          type: string
          description: Optional caution or tip (portion boxing, double-checks)
      required:
        - name
        - howToOrder
    CoachMenuScanAvoidItem:
      type: object
      properties:
        name:
          type: string
          description: Dish name as printed on the menu
        reason:
          type: string
          description: Short plain-language reason the dish does not fit
      required:
        - name
        - reason
    CoachMenuScanResult:
      type: object
      description: >-
        AI guidance derived from the photo — not official program copy.
        "ok" carries the dish lists; "not_menu" and "unreadable" explain the
        problem in message and carry empty lists.
      properties:
        result:
          type: string
          enum: [ok, not_menu, unreadable]
        message:
          type: string
          description: Short coach-voice summary or explanation
        menuTitle:
          type: string
          description: Restaurant or menu name when printed on the menu
        order:
          type: array
          items:
            $ref: "#/components/schemas/CoachMenuScanOrderItem"
        avoid:
          type: array
          items:
            $ref: "#/components/schemas/CoachMenuScanAvoidItem"
      required:
        - result
        - message
        - order
        - avoid
