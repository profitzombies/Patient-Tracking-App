        latestDate: { type: ["string", "null"], format: date }
    OfficeAlertSettings:
      type: object
      required: [recipientMode, recipientMemberIds, sendTime, timeZone, timeZoneSource, version, canEdit, me, team]
      properties:
        recipientMode: { type: string, enum: [all, owners_admins, selected] }
        recipientMemberIds: { type: array, items: { type: string } }
        sendTime: { type: string }
        timeZone: { type: string }
        timeZoneSource: { type: string, enum: [office, hq] }
        version: { type: number }
        canEdit: { type: boolean }
        me:
          type: object
          required: [emailEnabled, pushEnabled, email]
          properties: { emailEnabled: { type: boolean }, pushEnabled: { type: boolean }, email: { type: ["string", "null"] } }
        team:
          type: array
          items:
            type: object
            required: [id, name, role, status]
            properties: { id: { type: string }, name: { type: string }, role: { type: string }, status: { type: string } }
    OfficeAlertSettingsInput:
      type: object
      required: [expectedVersion, recipientMode, recipientMemberIds, sendTime, timeZone]
      properties:
        expectedVersion: { type: number, minimum: 0 }
        recipientMode: { type: string, enum: [all, owners_admins, selected] }
        recipientMemberIds: { type: array, items: { type: string } }
        sendTime: { type: string }
        timeZone: { type: ["string", "null"] }
    StaffAlertDelivery:
      type: object
      required: [id, providerId, officeName, channel, recipientEmail, status, suppressionReason, suppressionDetail, lastError, digestDate, flaggedCount, scheduledAt, sentAt, finalizedAt]
      properties:
        id: { type: string }
        providerId: { type: string }
        officeName: { type: string }
        channel: { type: string, enum: [push, email] }
        recipientEmail: { type: ["string", "null"] }
        status: { type: string }
        suppressionReason: { type: ["string", "null"] }
        suppressionDetail: { type: ["string", "null"] }
        lastError: { type: ["string", "null"] }
        digestDate: { type: ["string", "null"], format: date }
        flaggedCount: { type: number }
        scheduledAt: { type: string, format: date-time }
        sentAt: { type: ["string", "null"], format: date-time }
        finalizedAt: { type: ["string", "null"], format: date-time }
    OfficeRosterPatient:
      type: object
      required: [id, name, email, phone, phoneDisplay, activationStatus, verified, createdAt, program, invitation, attention, operational]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        phoneDisplay: { type: ["string", "null"] }
        activationStatus: { type: ["string", "null"] }
        verified: { type: boolean }
        createdAt: { type: ["string", "null"] }
        program: { $ref: "#/components/schemas/PatientProgram" }
        invitation:
          oneOf:
            - type: "null"
            - type: object
              required: [state, invitedAt, emailStatus, emailUpdatedAt]
              properties:
                state: { type: string, enum: [verified, pending] }
                invitedAt: { type: string }
                emailStatus: { type: string, enum: [pending, sent, failed] }
                emailUpdatedAt: { type: ["string", "null"] }
        operational:
          $ref: "#/components/schemas/OperationalPatient"
        attention:
          $ref: "#/components/schemas/PatientAttention"
        activeSubscription:
          type: ["boolean", "null"]
          description: >-
            True when the patient has an active, past-due, or unpaid shop
            subscription at this office; null when the billing tables could
            not be read (unknown, never false).
    OperationalPatient:
      type: object
      description: >-
        Recency facts and activity signals for one roster row, measured
        against the patient's own local day (asOfDate). `activity` is null
        when the office aggregate returned no row for the patient; the status
        is then `unknown` with no outreach reasons — missing data never reads
        as zero activity.
      required: [asOfDate, latestActivityDate, latestDiaryDate, latestWaterDate, latestCheckInDate, latestWeightDate, latestPhotoDate, loggedDays7, checkIns7, activity, status, reasons, followUps]
      properties:
        asOfDate: { type: string, format: date, description: Patient-local calendar day the signals were computed for. }
        latestActivityDate: { type: ["string", "null"], format: date }
        latestDiaryDate: { type: ["string", "null"], format: date }
        latestWaterDate: { type: ["string", "null"], format: date }
        latestCheckInDate: { type: ["string", "null"], format: date }
        latestWeightDate: { type: ["string", "null"], format: date }
        latestPhotoDate: { type: ["string", "null"], format: date }
        loggedDays7: { type: ["number", "null"], description: Distinct diary days in the 7-day window; null when the patient has no diary data yet or the aggregate is unavailable. }
        checkIns7: { type: ["number", "null"], description: Check-in days in the 7-day window; null when the patient has no check-ins yet or the aggregate is unavailable. }
        activity:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PatientActivitySignals"
        status: { type: string, enum: [invited, paused, discharged, inactive, needs_attention, on_track, unknown] }
        reasons:
          type: array
          items: { type: string, enum: [no_activity_14d, logging_lapsed, check_in_overdue] }
        followUps:
          type: array
          items: { $ref: "#/components/schemas/PatientOperationalFollowUp" }
    PatientActivitySignals:
      type: object
      description: >-
        Activity signals over the patient's stored diary, water and check-in
        rows, bucketed by the stored local day keys and anchored on asOfDate.
        Each family is null when there is no data of that kind yet: the diary
        family (loggedLast7, loggedDays7, mealStreak, avgCalories7) when the
        patient has never logged a diary entry, the check-in family
        (checkInStreak, checkInRate30, latestCheckInDate, moodCounts,
        topSideEffects) when they have never checked in. Averages are null
        when their window holds no qualifying day. Zero is only ever a real
        zero. The patient detail record's `engagement` uses the identical
        definitions.
      required: [asOfDate, loggedLast7, loggedDays7, mealStreak, avgCalories7, avgWater7, checkInStreak, checkInRate30, latestCheckInDate, moodCounts, topSideEffects]
      properties:
        asOfDate: { type: string, format: date }
        loggedLast7:
          description: Seven booleans, oldest first, ending on asOfDate — true when at least one diary entry exists that day.
          oneOf:
            - type: "null"
            - type: array
              minItems: 7
              maxItems: 7
              items: { type: boolean }
        loggedDays7: { type: ["number", "null"] }
        mealStreak: { type: ["number", "null"], description: Consecutive logged days ending on asOfDate, or on the day before while today is still open. }
        avgCalories7: { type: ["number", "null"], description: Rounded mean of per-day calorie totals over logged days in the 7-day window. }
        avgWater7: { type: ["number", "null"], description: Rounded mean ounces over 7-day-window days with water logged (oz > 0). }
        checkInStreak: { type: ["number", "null"], description: Consecutive check-in days ending on asOfDate or the day before. }
        checkInRate30: { type: ["number", "null"], description: Percent of the 30 days ending on asOfDate with a check-in (0-100). }
        latestCheckInDate: { type: ["string", "null"], format: date }
        moodCounts:
          oneOf:
            - type: "null"
            - type: object
              required: ["1", "2", "3", "4", "5"]
              properties:
                "1": { type: number }
                "2": { type: number }
                "3": { type: number }
                "4": { type: number }
                "5": { type: number }
        topSideEffects:
          description: Up to three side effects from the 30-day window, most frequent first (ties alphabetical).
          oneOf:
            - type: "null"
            - type: array
              maxItems: 3
              items:
                type: object
                required: [name, count]
                properties:
                  name: { type: string }
                  count: { type: number }
    PatientOperationalFollowUp:
      type: object
      required: [reason, status, createdAt, resolvedAt]
      properties:
        reason: { type: string, enum: [no_activity_14d, logging_lapsed, check_in_overdue] }
        status: { type: string, enum: [open, resolved] }
        createdAt: { type: string }
        resolvedAt: { type: ["string", "null"] }
    FollowUpUpdateInput:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [open, resolved] } }
    FollowUpResult:
      type: object
