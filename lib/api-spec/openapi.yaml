    OfficeRangeMetrics:
      type: object
      description: >-
        Office figures for a date range. Point-in-time counts are as of the range end;
        enrollments count inside the range; engaged, loggingPatients and checkInPatients
        use the trailing 7-day window ending on the range end (same contract as the
        network rollup's engaged7d); avgPoundsLost averages active patients with a
        recorded starting and current weight.
      required: [totalPatients, activePatients, enrollments, engaged, needsAttention, inactive, invited, loggingLapsed, checkInsOverdue, loggingPatients, checkInPatients, loggingAdherencePct, checkInAdherencePct, avgPoundsLost]
      properties:
        totalPatients: { type: number, description: Patients on the roster as of the range end }
        activePatients: { type: number, description: Activated patients as of the range end }
        enrollments: { type: number, description: Patients created inside the range }
        engaged: { type: number, description: Active patients with any activity in the 7 days ending on the range end }
        needsAttention: { type: number }
        inactive: { type: number }
        invited: { type: number }
        loggingLapsed: { type: number }
        checkInsOverdue: { type: number }
        loggingPatients: { type: number, description: Active patients with a meal log in the 7 days ending on the range end }
        checkInPatients: { type: number, description: Active patients with a check-in in the 7 days ending on the range end }
        loggingAdherencePct: { type: ["number", "null"], description: loggingPatients / activePatients, null when no active patients }
        checkInAdherencePct: { type: ["number", "null"], description: checkInPatients / activePatients, null when no active patients }
        avgPoundsLost: { type: ["number", "null"], description: Average pounds lost across active patients with recorded weights; null when none }
    OfficeSeriesPoint:
      type: object
      description: One day of an office's series. engagedPatients is a rolling 7-day count (active patients with activity in [date-6, date]); enrollments and checkIns are exact-day counts.
      required: [date, activePatients, engagedPatients, enrollments, checkIns]
      properties:
        date: { type: string, format: date }
        activePatients: { type: number }
        engagedPatients: { type: number, description: Active patients with any activity in the 7 days ending on this date }
        enrollments: { type: number }
        checkIns: { type: number }
    DateRangeKeys:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
    OfficeComparisonRow:
      type: object
      required: [providerId, officeName, providerName, firstPatientDate, available, metrics, series]
      properties:
        providerId: { type: string }
        officeName: { type: string }
        providerName: { type: string }
        firstPatientDate: { type: ["string", "null"], format: date }
        available: { type: boolean, description: "False when the whole range predates the first patient record" }
        metrics:
          oneOf:
            - $ref: "#/components/schemas/OfficeRangeMetrics"
            - type: "null"
        series:
          type: array
          items: { $ref: "#/components/schemas/OfficeSeriesPoint" }
    OfficeComparisonResult:
      type: object
      required: [range, asOf, offices]
      properties:
        range: { $ref: "#/components/schemas/DateRangeKeys" }
        asOf: { type: string }
        offices:
          type: array
          items: { $ref: "#/components/schemas/OfficeComparisonRow" }
    OfficeAnalyticsResult:
      type: object
      required: [office, range, asOf, firstPatientDate, available, metrics, series]
      properties:
        office:
          type: object
          required: [providerId, officeName]
          properties:
            providerId: { type: string }
            officeName: { type: string }
        range: { $ref: "#/components/schemas/DateRangeKeys" }
        asOf: { type: string }
        firstPatientDate: { type: ["string", "null"], format: date }
        available: { type: boolean }
        metrics:
          oneOf:
            - $ref: "#/components/schemas/OfficeRangeMetrics"
            - type: "null"
        series:
          type: array
          items: { $ref: "#/components/schemas/OfficeSeriesPoint" }
    ExportKind:
