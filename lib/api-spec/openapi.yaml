      properties:
        id: { type: string }
        providerId: { type: string }
        officeName: { type: string, nullable: true }
        name: { type: string }
        initials: { type: string }
        program:
          type: object
          required: [startDate, day, stage, week]
          properties:
            startDate: { type: string, nullable: true }
            day: { type: number, nullable: true }
            stage: { type: string, nullable: true, enum: [protocol, maintenance] }
            week: { type: number, nullable: true }
        asOfDate: { type: string, format: date }
        periodStart: { type: string, format: date }
        baselineWeight: { type: number }
        baselineWeightDate: { type: string, nullable: true }
        latestWeight: { type: number }
        latestWeightDate: { type: string, nullable: true }
        poundsLost: { type: number }
        percentLost: { type: number }
        goalCompletion: { type: number, nullable: true }
        adherence:
          type: object
          required: [score, eligibleDays, loggedDays, checkInDays, waterGoalDays, loggedRate, checkInRate, waterRate]
          properties:
            score: { type: number, nullable: true }
            eligibleDays: { type: number }
            loggedDays: { type: number }
            checkInDays: { type: number }
            waterGoalDays: { type: number }
            loggedRate: { type: number, nullable: true }
            checkInRate: { type: number, nullable: true }
            waterRate: { type: number, nullable: true }
        ranks:
          type: object
          required: [percent, pounds, goal, adherence]
          properties:
            percent: { type: number }
            pounds: { type: number }
            goal: { type: number }
            adherence: { type: number }
    NutritionAmounts:
      type: object
      required: [calories, protein, carbs, fat]
      properties:
        calories: { type: number }
        protein: { type: number }
        carbs: { type: number }
        fat: { type: number }
    OfficePatientRecord:
      type: object
      required: [office, patient, diary, water, checkIns, engagement, weights, progressPhotos, account]
      properties:
        office: { $ref: "#/components/schemas/OfficeSummary" }
        engagement:
          description: Activity signals computed over the diary, water and checkIns rows below for the patient's local day — the same definitions as the roster's `operational.activity`.
          $ref: "#/components/schemas/PatientActivitySignals"
        patient:
          type: object
          required: [identity, program]
          properties:
            identity:
              type: object
              required: [id, name, email, phone, phoneDisplay, activationStatus, verified, dateOfBirth, height, timezone, createdAt, claimedAt, lastLoginAt]
              properties:
                id: { type: string }
                name: { type: string }
                email: { type: ["string", "null"] }
                phone: { type: ["string", "null"] }
                phoneDisplay: { type: ["string", "null"] }
                activationStatus: { type: ["string", "null"] }
                verified: { type: boolean }
                dateOfBirth: { type: ["string", "null"], format: date }
                height: { type: ["string", "null"] }
                timezone: { type: ["string", "null"] }
                createdAt: { type: ["string", "null"] }
                claimedAt: { type: ["string", "null"] }
                lastLoginAt: { type: ["string", "null"] }
            program: { $ref: "#/components/schemas/PatientProgram" }
        diary:
          type: object
          required: [entries, nutritionTotals]
          properties:
            entries:
              type: array
              items:
                type: object
                required: [id, dateKey, meal, kind, name, detail, quantity, calories, protein, carbs, fat]
                additionalProperties: true
                properties:
                  id: { type: string }
                  dateKey: { type: string, format: date }
                  meal: {}
                  kind: {}
                  name: {}
                  detail: { type: string }
                  quantity: { type: number }
                  calories: { type: number }
                  protein: { type: number }
                  carbs: { type: number }
                  fat: { type: number }
            nutritionTotals:
              type: object
              required: [overall, byDate]
              properties:
                overall: { $ref: "#/components/schemas/NutritionAmounts" }
                byDate:
                  type: array
                  items:
                    allOf:
                      - $ref: "#/components/schemas/NutritionAmounts"
                      - type: object
                        required: [dateKey]
                        properties:
                          dateKey: { type: string, format: date }
        water:
          type: array
          items:
            type: object
            required: [dateKey, oz]
            properties:
              dateKey: { type: string, format: date }
              oz: { type: number }
        checkIns:
          type: array
          items:
            type: object
            required: [id, dateKey, weight, mood, sideEffects, notes]
            properties:
              id: { type: string }
              dateKey: { type: string, format: date }
              weight: { type: ["number", "null"] }
              mood: { type: ["number", "null"] }
              sideEffects: { type: array, items: {} }
              notes: { type: ["string", "null"] }
        weights:
          type: array
          items:
            type: object
            required: [dateKey, weight]
            properties:
              dateKey: { type: string, format: date }
              weight: { type: number }
        progressPhotos:
          type: array
          items:
            type: object
            required: [id, dateKey, label, angle, url]
            properties:
              id: { type: string }
              dateKey: { type: string, format: date }
              label: { type: string }
              angle: { type: ["string", "null"] }
              url: { type: ["string", "null"] }
        account:
          type: object
          required: [targets, favorites, recents, customFoods, savedRecipes, flags]
          additionalProperties: true
          properties:
            targets:
              type: object
              additionalProperties: { type: ["number", "null"] }
            favorites: { type: array, items: {} }
            recents: { type: array, items: {} }
            customFoods:
              type: array
              items:
                type: object
                additionalProperties: true
                required: [id, name, brand, serving, calories, protein, carbs, fat, photoUrl]
                properties:
                  photoUrl: { type: ["string", "null"] }
            savedRecipes:
              type: array
              items:
                type: object
                additionalProperties: true
                required: [id, name, photoUrl]
                properties:
                  photoUrl: { type: ["string", "null"] }
            flags:
              type: object
              additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CoachChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, staff]
          description: >-
            "staff" is a care-team message the patient saw in this thread.
            The server replays it to the model as context only; the coach
            never answers it or speaks for the care team.
        content:
          type: string
          maxLength: 4000
        stopped:
          type: boolean
          description: >-
            True when the patient stopped this assistant reply mid-stream, so
            its text is an incomplete fragment. The server annotates flagged
            replies before replaying them to the model, keeping the next
            answer from continuing the cut-off sentence. Ignored on user
            messages.
        image:
          type: string
          maxLength: 8000000
          description: >-
            Optional photo attached to this user message, as a base64
            data URI (JPEG, PNG, or WebP). Honored only on the final message
            of the request — history replays carry text only, so a photo is
            never re-sent on later turns. Analyzed in memory and never
            stored. Ignored on assistant messages.
        photoKind:
          type: string
          enum: [menu, meal, label]
          description: >-
            What the attached photo shows, chosen by the client flow that
            captured it: "menu" runs the restaurant menu scan; "meal" runs
            the meal analysis that identifies visible foods with estimated
            portions and returns an editable meal card; "label" runs the
            nutrition label reader that transcribes the printed facts and
            emits a labelDraft event for the client's name conversation.
            When absent, the server inspects the photo and routes it to the
            fitting pipeline itself. Ignored without an image.
      required:
        - role
        - content
    CoachChatInput:
      type: object
      properties:
        conversationId:
          type: string
          description: >-
            Optional active Coach conversation. When omitted, the compatibility
            Coach transcript is used for older clients.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CoachChatMessage"
          minItems: 1
          maxItems: 30
        localTime:
          type: string
          maxLength: 5
          description: >-
            The patient's device-local wall clock when this turn was sent, as
            24-hour "HH:MM" (for example "14:05"). Used only to preselect the
            diary slot on a recipe or meal card generated this turn when the
            patient names no meal: the server derives a time-of-day default
            (around 2 pm that is lunch) for the prompts and the missing-slot
            fallbacks. Unparseable values are ignored, and when the field is
            absent (older clients) the server keeps its legacy defaults.
        mealSlot:
          type: string
          enum: [breakfast, lunch, dinner, snacks]
          description: >-
            Explicit diary slot for any card generated on this turn, sent by
            entry points that already know which meal is being logged (for
            example a per-meal camera on a diary row). Wins over both a meal
            the patient names and the time-of-day default, and flows through
            to the card payload untouched.
        localDate:
          type: string
          maxLength: 10
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: >-
            The app's own calendar date for this turn as "YYYY-MM-DD". Sent
            only with authenticated (signed-in patient) requests so the
            server grounds the coach's live "today so far" context on the
            same diary day the app is showing. Absent for the demo persona
            and older clients; invalid values are ignored server-side.
      required:
        - messages
    SupportChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, staff]
          description: >-
            "staff" is a care-team message the patient saw in this thread,
            replayed to the model as context only.
        content:
          type: string
          maxLength: 8000
          description: >-
            Provider questions are capped at 4000 characters by the composer;
            the higher limit exists because comprehensive assistant answers
            replay as history on later turns. Clients truncate any longer
            replayed reply to fit (the model only needs the gist for
            continuity), keeping request bodies under the JSON size cap.
        stopped:
          type: boolean
          description: >-
            True when the provider stopped this assistant reply mid-stream,
            so its text is an incomplete fragment. The server annotates
            flagged replies before replaying them to the model, keeping the
            next answer from continuing the cut-off text. Ignored on user
            messages.
      required:
        - role
        - content
    SupportChatInput:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SupportChatMessage"
          minItems: 1
          maxItems: 30
      required:
        - messages
    CoachRecipeImageInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 200
      required:
        - name
    CoachRecipeImageResult:
      type: object
      properties:
        image:
          type: string
          description: JPEG photo as a data URI
      required:
        - image
    CoachMenuScanInput:
      type: object
      properties:
        image:
          type: string
          description: >-
            Menu photo as a base64 data URI (image/jpeg, image/png, or
            image/webp), downscaled and compressed client-side before upload.
          maxLength: 8000000
      required:
        - image
    CoachMenuScanOrderItem:
      type: object
      properties:
        name:
          type: string
          description: Dish name as printed on the menu
        howToOrder:
          type: string
          description: >-
            Plain-language request to the server covering every needed
            modification (e.g. grilled plain, no butter or oil, sauce off)
        note:
          type: string
          description: Optional caution or tip (portion boxing, double-checks)
      required:
        - name
        - howToOrder
    CoachMenuScanAvoidItem:
      type: object
      properties:
        name:
          type: string
          description: Dish name as printed on the menu
        reason:
          type: string
          description: Short plain-language reason the dish does not fit
      required:
        - name
        - reason
    CoachMenuScanResult:
      type: object
      description: >-
        AI guidance derived from the photo — not official program copy.
        "ok" carries the dish lists; "not_menu" and "unreadable" explain the
        problem in message and carry empty lists.
      properties:
        result:
          type: string
          enum: [ok, not_menu, unreadable]
        message:
          type: string
          description: Short coach-voice summary or explanation
        menuTitle:
          type: string
          description: Restaurant or menu name when printed on the menu
        order:
          type: array
          items:
            $ref: "#/components/schemas/CoachMenuScanOrderItem"
        avoid:
          type: array
          items:
            $ref: "#/components/schemas/CoachMenuScanAvoidItem"
      required:
        - result
        - message
        - order
        - avoid
    CoachLabelScanInput:
      type: object
      properties:
        image:
          type: string
          description: >-
            Nutrition Facts photo as a base64 data URI (image/jpeg, image/png,
            or image/webp), downscaled and compressed client-side before
            upload.
          maxLength: 8000000
      required:
        - image
    CoachLabelScanLabel:
      type: object
      description: >-
        Validated per-serving transcription of one Nutrition Facts panel —
        the same read the coach chat's labelDraft SSE event carries. Printed
        values only; optional fields are omitted when the panel does not
        print them legibly.
      properties:
        id:
          type: string
          description: Server-issued draft id ("label_...")
        servingSize:
          type: string
          description: Printed serving size line, e.g. "2/3 cup (55g)"
        servingsPerContainer:
          type: number
          description: Printed container count; omitted when not printed
        calories:
          type: number
          description: Calories per serving as printed
        protein:
          type: number
          description: Grams per serving
        carbs:
          type: number
          description: Grams per serving
        fat:
          type: number
          description: Grams per serving
        nutritionSnapshot:
          $ref: "#/components/schemas/FoodNutritionSnapshot"
        fiber:
          type: number
          description: Grams per serving; omitted when not printed legibly
        sugar:
          type: number
          description: Grams per serving; omitted when not printed legibly
        sodium:
          type: number
          description: Milligrams per serving; omitted when not printed legibly
        suggestedSlot:
          type: string
          enum: [breakfast, lunch, dinner, snacks]
          description: Diary slot a chat food card would preselect; advisory here
        flagged:
          type: boolean
          description: >-
            Printed calories disagree wildly with the 4/4/9 macro math
            (misprint or misread) — worth a double check of the package
      required:
        - id
        - servingSize
        - calories
        - protein
        - carbs
        - fat
        - suggestedSlot
    CoachLabelScanResult:
      type: object
      description: >-
        "ok" carries the transcribed label; "not_label" and "unreadable"
        explain the problem in message and carry no label. An illegible
        required value makes the whole shot "unreadable" — values are never
        estimated.
      properties:
        result:
          type: string
          enum: [ok, not_label, unreadable]
        message:
          type: string
          description: >-
            Coach-voice reaction (ok) or warm retake nudge (not_label /
            unreadable); may contain blank-line paragraph breaks
        label:
          $ref: "#/components/schemas/CoachLabelScanLabel"
      required:
        - result
        - message
    BarcodeFood:
      type: object
      description: >-
        Per-serving nutrition facts for one packaged product, keyed by its
        canonical barcode (EAN-8 kept as 8 digits, UPC-A zero-padded to its
        GTIN-13 form). Published values only, never estimates.
      properties:
        code:
          type: string
          description: Canonical barcode the facts are stored under
        name:
          type: string
          description: Product name as published
        brand:
          type: string
          description: Label brand; omitted when the source lists none
        serving:
          type: string
          description: >-
            Serving the values describe, e.g. "30 g" ("100 g" when the
            source only published per-100g values)
        calories:
          type: number
          description: Calories per serving
        protein:
          type: number
          description: Grams per serving
        carbs:
          type: number
          description: Grams per serving
        fat:
          type: number
          description: Grams per serving
      required:
        - code
        - name
        - serving
        - calories
        - protein
        - carbs
        - fat
    BarcodeLookupResult:
      type: object
      description: >-
        "found" carries the product facts plus where they were served from
        (cache, table, or openfoodfacts; the first two mean no third-party
        call was made). "not_found" carries an honest message pointing to
        the label scanner instead - nutrition numbers are never invented.
      properties:
        result:
          type: string
          enum: [found, not_found]
        source:
          type: string
          enum: [cache, table, openfoodfacts]
          description: Where the facts came from; present only when found
        food:
          $ref: "#/components/schemas/BarcodeFood"
        message:
          type: string
          description: Present only for not_found
      required:
        - result
    FoodNutritionSource:
      type: object
      additionalProperties: false
      required: [provider, recordId, revision]
      properties:
        provider: { type: string }
        recordId: { type: string }
        release: { type: string }
        revision: { type: string }
        canonicalName: { type: string }
    FoodNutritionBasis:
      type: object
      additionalProperties: false
      required: [amount, unit, label]
      properties:
        amount: { type: number }
        unit: { type: string }
        label: { type: string }
        grams: { type: number }
    FoodNutritionNutrient:
      type: object
      additionalProperties: false
      required: [id, name, unit, amount]
      properties:
        id: { type: string }
        name: { type: string }
        unit: { type: string }
        amount: { type: number }
    FoodNutritionPortion:
      type: object
      additionalProperties: false
      required: [id, label, unit, dimension, basisMultiplier]
      properties:
        id: { type: string }
        label: { type: string }
        unit: { type: string }
        dimension:
          type: string
          enum: [weight, volume, count, serving]
        basisMultiplier: { type: number }
        grams: { type: number }
        evidence: { type: string }
    FoodNutritionVariant:
      type: object
      additionalProperties: false
