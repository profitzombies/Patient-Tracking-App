  /patient-care-team/{conversationId}/read:
    post:
      operationId: readPatientCareTeam
      tags: [office]
      summary: Advance the patient's private read high-water mark
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationReadInput" }
      responses:
        "200":
          description: Idempotent read position result
          content: { application/json: { schema: { $ref: "#/components/schemas/ConversationReadResult" } } }
