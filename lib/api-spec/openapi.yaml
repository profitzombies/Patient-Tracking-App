openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: coach
    description: AI coach chat for patients
paths:
  /coach/chat:
    post:
      operationId: coachChat
      tags: [coach]
      summary: Stream an AI coach reply for a patient chat turn
      description: >-
        Stateless SSE endpoint. The client sends its in-session message history
        and receives a text/event-stream of assistant chunks
        ("data: {\"content\": \"...\"}" lines followed by
        "data: {\"done\": true}"). Patient program context is derived
        server-side from the demo seed; rate limits apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachChatInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid request body
        "429":
          description: Rate limited
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CoachChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 4000
      required:
        - role
        - content
    CoachChatInput:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CoachChatMessage"
          minItems: 1
          maxItems: 30
      required:
        - messages

