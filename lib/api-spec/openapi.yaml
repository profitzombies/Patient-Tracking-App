openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: coach
    description: AI coach chat for patients
  - name: training
    description: >-
      Hosted training-video media. Callers authenticate with their existing
      Supabase staff session (Authorization: Bearer <access token>); HQ admins
      manage files and run AI processing, provider staff fetch playback URLs.
  - name: knowledge
    description: >-
      AI Support knowledge base. HQ admins upload PDF / Word / text documents;
      the server verifies each upload in App Storage, extracts the full text,
      and stores it with a short summary + keywords for answer routing. Same
      auth model as training: the caller's existing Supabase staff session
      rides as a bearer token and is re-verified on every call.
paths:
  /coach/chat:
    post:
      operationId: coachChat
      tags: [coach]
      summary: Stream an AI coach reply for a patient chat turn
      description: >-
        Stateless SSE endpoint. The client sends its in-session message history
        and receives a text/event-stream of assistant chunks
        ("data: {\"content\": \"...\"}" lines followed by
        "data: {\"done\": true}"), optionally with one
        "data: {\"card\": {\"kind\", \"payload\"}}" event before done.
        A photo turn sent without photoKind is triaged server-side and the
        resolved route is announced early as one
        "data: {\"photoKind\": \"menu\"|\"meal\"|\"label\"}" event, so a
        client retry of that turn can name the same route explicitly.
        Card kinds: "product" — a curated THINNR product suggestion
        ({\"id\", \"name\", \"line\", \"price\"}); "recipe" — a structured
        recipe suggestion emitted on meal-idea and craving turns, whose
        ingredients in cravings mode are validated server-side against the
        official Approved Foods list. A nutrition label photo turn also
        emits one "data: {\"labelDraft\": {...}}" event before done — the
        validated per-serving read (servingSize, servingsPerContainer,
        calories, protein, carbs, fat, optional fiber/sugar/sodium,
        suggestedSlot, flagged) that the client holds through the follow-up
        name conversation; clients that predate it ignore the event. Patient
        program context is derived server-side from the demo seed; rate
        limits apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachChatInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid request body
        "429":
          description: Rate limited
  /coach/recipe-image:
    post:
      operationId: coachRecipeImage
      tags: [coach]
      summary: Generate a dish photo for an AI-suggested recipe
      description: >-
        Generates a single appetizing dish photo for a coach recipe suggestion
        and returns it as a JPEG data URI, small enough for the client to
        persist alongside a saved recipe. Rate limited separately from chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachRecipeImageInput"
      responses:
        "200":
          description: Generated photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeImageResult"
        "400":
          description: Invalid request body
        "429":
          description: Rate limited
        "502":
          description: Image generation failed
  /coach/menu-scan:
    post:
      operationId: coachMenuScan
      tags: [coach]
      summary: Scan a restaurant menu photo for THINNR-compatible orders
      description: >-
        Analyzes one menu photo with the coach's vision model, grounded in the
        verbatim Approved Foods list and the restaurant guide's ordering
        rules, and returns structured AI guidance: dishes on that menu that
        can work (each with the exact modification to request), dishes to
        avoid, or a signal that the photo is not a readable menu. The photo is
        analyzed in memory only and never stored server-side. This route
        accepts a larger JSON body than the rest of the API (photo payload)
        and is rate limited separately from chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachMenuScanInput"
      responses:
        "200":
          description: Structured scan result (AI guidance, not program copy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMenuScanResult"
        "400":
          description: Invalid request body or unsupported photo format
        "413":
          description: Photo payload too large
        "429":
          description: Rate limited
        "502":
          description: Menu scan failed
  /coach/label-scan:
    post:
      operationId: coachLabelScan
      tags: [coach]
      summary: Read a Nutrition Facts photo into per-serving values
      description: >-
        Runs the same nutrition-label reader as the coach chat's label photo
        turns — transcription only, never estimates — and returns the
        validated per-serving read directly, for non-chat surfaces like the
        create-food screen. "ok" carries the label values; "not_label" and
        "unreadable" explain the problem in message (coach-voiced, warm,
        ending with the same retake nudge the chat uses) and carry no label,
        because nothing is ever guessed. The photo is analyzed in memory only
        and never stored server-side. This route accepts a larger JSON body
        than the rest of the API (photo payload) and shares the photo-scan
        rate budget with menu scans and chat photo turns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachLabelScanInput"
      responses:
        "200":
          description: Structured label read (transcribed values, no estimates)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachLabelScanResult"
        "400":
          description: Invalid request body or unsupported photo format
        "413":
          description: Photo payload too large
        "429":
          description: Rate limited
        "502":
          description: Label scan failed
  /training/videos/{videoId}/upload-url:
    post:
      operationId: trainingVideoUploadUrl
      tags: [training]
      summary: Mint a presigned upload URL for a training video file
      description: >-
        HQ admins only. Returns a short-lived presigned PUT URL so the browser
        uploads the file straight to App Storage (the API never proxies the
        body), plus the canonical object path to send back to finalize.
        Nothing is written to the video row until finalize verifies the bytes.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingUploadUrlInput"
      responses:
        "200":
          description: Presigned PUT URL and the object path it creates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingUploadUrlResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "413":
          description: File exceeds the 500 MB limit
        "415":
          description: Not an accepted video container (MP4/WebM/MOV)
  /training/videos/{videoId}/video:
    post:
      operationId: trainingVideoFinalize
      tags: [training]
      summary: Attach an uploaded file to the video after verifying it
      description: >-
        HQ admins only. Verifies the uploaded object exists under this video's
        prefix, ffprobes it (authoritative duration and playability check),
        persists the object path and duration, clears the previous file's
        transcript/thumbnail, and deletes the replaced object. Then captures
        the first frame as the thumbnail automatically — a capture failure is
        non-fatal and reported as thumbnailSource null. Stores only object
        paths — playback URLs are minted per request.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingFinalizeInput"
      responses:
        "200":
          description: The file is now this lesson's hosted video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingFinalizeResult"
        "400":
          description: Invalid body or object path outside this video's prefix
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: Video row or uploaded object not found
        "413":
          description: File exceeds the 500 MB limit
        "422":
          description: The bytes are not a playable video
    delete:
      operationId: trainingVideoRemoveFile
      tags: [training]
      summary: Remove the hosted file (the lesson row stays)
      description: >-
        HQ admins only. Clears the video's hosted file, thumbnail, and
        transcript, and deletes the stored objects. The lesson itself keeps
        its metadata and returns to the simulated-slides experience.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      responses:
        "200":
          description: Hosted file removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingRemoveFileResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "409":
          description: There is no hosted file to remove
  /training/videos/{videoId}/thumbnail-upload-url:
    post:
      operationId: trainingThumbnailUploadUrl
      tags: [training]
      summary: Mint a presigned upload URL for a custom lesson thumbnail
      description: >-
        HQ admins only. Returns a short-lived presigned PUT URL for a JPG, PNG,
        or WebP thumbnail plus the current video source revision. The revision
        is sent to finalize so a thumbnail upload cannot land on a replacement
        video.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingThumbnailUploadUrlInput"
      responses:
        "200":
          description: Presigned PUT URL and the current video revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingThumbnailUploadUrlResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "409":
          description: No hosted video
        "413":
          description: File exceeds the 10 MB limit
        "415":
          description: Not an accepted image type (JPG/PNG/WebP)
  /training/videos/{videoId}/thumbnail-upload:
    post:
      operationId: trainingThumbnailUpload
      tags: [training]
      summary: Validate and attach a custom lesson thumbnail
      description: >-
        HQ admins only. Verifies the uploaded object belongs to this video,
        checks its size, MIME declaration, and image signature/dimensions, then
        replaces the prior thumbnail safely. The supplied video source revision
        prevents an upload started before a video replacement from becoming
        the cover of the new video.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingThumbnailFinalizeInput"
      responses:
        "200":
          description: Custom thumbnail attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingThumbnailResult"
        "400":
          description: Invalid body or object path outside this video's thumbnail prefix
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: Video row or uploaded object not found
        "409":
          description: No hosted video or the video changed during upload
        "413":
          description: File is empty or exceeds the 10 MB limit
        "422":
          description: Uploaded bytes are not a valid JPG, PNG, or WebP
  /training/videos/{videoId}/media:
    get:
      operationId: trainingVideoMedia
      tags: [training]
      summary: Short-lived signed playback URLs for a hosted video
      description: >-
        HQ admins and provider staff. Returns signed GET URLs for the video
        file (and thumbnail when one exists) so the <video> element's range
        requests hit storage directly — that is what makes seeking work. URLs
        expire; clients re-request rather than persist them.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      responses:
        "200":
          description: Signed playback URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingMediaResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not staff
        "404":
          description: Video row missing or no file hosted
  /training/videos/{videoId}/transcript:
    get:
      operationId: trainingVideoTranscript
      tags: [training]
      summary: Timed transcript of the hosted video
      description: >-
        HQ admins only (the editor's transcript viewer). Segments follow the
        transcription grid — near-minute slices with start/end seconds.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      responses:
        "200":
          description: Timed transcript segments in playback order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingTranscriptResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: Video row missing or no transcript yet
  /training/videos/{videoId}/thumbnail:
    post:
      operationId: trainingVideoThumbnail
      tags: [training]
      summary: Capture a video frame as the lesson thumbnail
      description: >-
        HQ admins only. The editor's thumbnail dialog scrubs the real video
        client-side, then sends the chosen time; the server extracts that
        frame with ffmpeg, stores it, and replaces the previous thumbnail.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingThumbnailInput"
      responses:
        "200":
          description: Thumbnail captured and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingThumbnailResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "409":
          description: No hosted video to capture from
  /training/videos/{videoId}/process:
    post:
      operationId: trainingVideoProcess
      tags: [training]
      summary: Run the AI pass over the hosted video (SSE progress)
      description: >-
        HQ admins only; one run per video at a time. Streams step-by-step
        progress as SSE "data:" JSON lines — {"step", "status":
        "running"|"done"|"failed"|"skipped", ...payload} with comment
        keepalives — and ends with {"done": true, "ok": boolean}. Steps in
        order: "transcribe" (audio → timed segments, saved server-side),
        "describe" (model writes catalog paragraphs from the transcript),
        "chapters" (model picks chapter starts on the transcription grid),
        "thumbnail" (first frame captured and stored). Each step persists on
        success immediately; a failed step reports plainly and later runs can
        retry just the remaining steps via "steps". Description/chapters are
        skipped when transcription fails in the same run.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingProcessInput"
      responses:
        "200":
          description: SSE stream of step progress events
          content:
            text/event-stream: {}
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "409":
          description: No hosted video, or a run is already in progress
  /knowledge/upload-url:
    post:
      operationId: knowledgeUploadUrl
      tags: [knowledge]
      summary: Mint a presigned upload URL for a new knowledge document
      description: >-
        HQ admins only. Validates the declared type and size, mints a fresh
        document id, and returns a short-lived presigned PUT URL plus the
        canonical object path bound to that id
        (/objects/knowledge-docs/<documentId>/…). Nothing is written to the
        database until the create call verifies the uploaded bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUploadUrlInput"
      responses:
        "200":
          description: Presigned PUT URL, the new document id, and its object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUploadUrlResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "413":
          description: File exceeds the 25 MB limit
        "415":
          description: Not an accepted document type (PDF, Word .docx, text, Markdown)
  /knowledge/documents:
    get:
      operationId: knowledgeListDocuments
      tags: [knowledge]
      summary: List every knowledge document (without extracted text)
      description: >-
        HQ admins only. Returns all documents newest-first with status,
        summary, and keyword metadata — extracted text stays out of the list
        payload and is fetched per document.
      responses:
        "200":
          description: All knowledge documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentList"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
    post:
      operationId: knowledgeCreateDocument
      tags: [knowledge]
      summary: Create the document after verifying the uploaded bytes
      description: >-
        HQ admins only. Verifies the uploaded object exists under the minted
        document id's prefix and respects the size cap, inserts the document
        row, and starts text extraction in the background. The response
        returns immediately; clients poll the list or detail endpoint while
        status moves uploaded → extracting → ready or failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeCreateInput"
      responses:
        "200":
          description: The created document, extraction underway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          description: Invalid body or object path outside the document's prefix
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: The uploaded object never arrived
        "409":
          description: That document id already exists
        "413":
          description: File exceeds the 25 MB limit
        "415":
          description: Not an accepted document type
        "422":
          description: The uploaded file is empty
  /knowledge/documents/{documentId}:
    get:
      operationId: knowledgeGetDocument
      tags: [knowledge]
      summary: Fetch one document including its extracted text
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      responses:
        "200":
          description: The document with extracted text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentDetail"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such knowledge document
    patch:
      operationId: knowledgeRenameDocument
      tags: [knowledge]
      summary: Rename a document (its stored file is untouched)
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeRenameInput"
      responses:
        "200":
          description: The renamed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          description: Invalid title
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such knowledge document
    delete:
      operationId: knowledgeDeleteDocument
      tags: [knowledge]
      summary: Delete a document and its stored file
      description: >-
        HQ admins only. Deletes the stored object from App Storage and then
        removes the row — extracted text, summary, and keywords go with it.
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDeleteResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such knowledge document
  /knowledge/documents/{documentId}/upload-url:
    post:
      operationId: knowledgeReplaceUploadUrl
      tags: [knowledge]
      summary: Mint a presigned upload URL to replace a document's file
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUploadUrlInput"
      responses:
        "200":
          description: Presigned PUT URL and object path under this document's prefix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUploadUrlResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such knowledge document
        "413":
          description: File exceeds the 25 MB limit
        "415":
          description: Not an accepted document type
  /knowledge/documents/{documentId}/file:
    post:
      operationId: knowledgeReplaceFile
      tags: [knowledge]
      summary: Swap in a replacement file after verifying it
      description: >-
        HQ admins only. Verifies the uploaded object under this document's
        prefix, clears the old extracted text / summary / keywords (they
        described the OLD file), swaps the stored object path in one
        conditional write, deletes the replaced object, and re-runs
        extraction on the new bytes.
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeReplaceInput"
      responses:
        "200":
          description: The document with the replacement file, extraction underway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          description: Invalid body or object path outside this document's prefix
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: Document row or uploaded object not found
        "409":
          description: The document changed while finalizing — upload again
        "413":
          description: File exceeds the 25 MB limit
        "415":
          description: Not an accepted document type
        "422":
          description: The uploaded file is empty
  /knowledge/documents/{documentId}/extract:
    post:
      operationId: knowledgeRetryExtraction
      tags: [knowledge]
      summary: Re-run text extraction on the stored file
      description: >-
        HQ admins only. Re-reads the stored object and runs extraction again —
        the retry for failed documents (also unsticks a document left in
        "extracting" by a server restart). One run per document at a time.
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      responses:
        "202":
          description: Extraction restarted; poll the document for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeExtractResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such knowledge document
        "409":
          description: An extraction run is already in progress
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CoachChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 4000
        stopped:
          type: boolean
          description: >-
            True when the patient stopped this assistant reply mid-stream, so
            its text is an incomplete fragment. The server annotates flagged
            replies before replaying them to the model, keeping the next
            answer from continuing the cut-off sentence. Ignored on user
            messages.
        image:
          type: string
          maxLength: 8000000
          description: >-
            Optional photo attached to this user message, as a base64
            data URI (JPEG, PNG, or WebP). Honored only on the final message
            of the request — history replays carry text only, so a photo is
            never re-sent on later turns. Analyzed in memory and never
            stored. Ignored on assistant messages.
        photoKind:
          type: string
          enum: [menu, meal, label]
          description: >-
            What the attached photo shows, chosen by the client flow that
            captured it: "menu" runs the restaurant menu scan; "meal" runs
            the meal analysis that identifies visible foods with estimated
            portions and returns an editable meal card; "label" runs the
            nutrition label reader that transcribes the printed facts and
            emits a labelDraft event for the client's name conversation.
            When absent, the server inspects the photo and routes it to the
            fitting pipeline itself. Ignored without an image.
      required:
        - role
        - content
    CoachChatInput:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/CoachChatMessage"
          minItems: 1
          maxItems: 30
        localTime:
          type: string
          maxLength: 5
          description: >-
            The patient's device-local wall clock when this turn was sent, as
            24-hour "HH:MM" (for example "14:05"). Used only to preselect the
            diary slot on a recipe or meal card generated this turn when the
            patient names no meal: the server derives a time-of-day default
            (around 2 pm that is lunch) for the prompts and the missing-slot
            fallbacks. Unparseable values are ignored, and when the field is
            absent (older clients) the server keeps its legacy defaults.
        mealSlot:
          type: string
          enum: [breakfast, lunch, dinner, snacks]
          description: >-
            Explicit diary slot for any card generated on this turn, sent by
            entry points that already know which meal is being logged (for
            example a per-meal camera on a diary row). Wins over both a meal
            the patient names and the time-of-day default, and flows through
            to the card payload untouched.
      required:
        - messages
    CoachRecipeImageInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 200
      required:
        - name
    CoachRecipeImageResult:
      type: object
      properties:
        image:
          type: string
          description: JPEG photo as a data URI
      required:
        - image
    CoachMenuScanInput:
      type: object
      properties:
        image:
          type: string
          description: >-
            Menu photo as a base64 data URI (image/jpeg, image/png, or
            image/webp), downscaled and compressed client-side before upload.
          maxLength: 8000000
      required:
        - image
    CoachMenuScanOrderItem:
      type: object
      properties:
        name:
          type: string
          description: Dish name as printed on the menu
        howToOrder:
          type: string
          description: >-
            Plain-language request to the server covering every needed
            modification (e.g. grilled plain, no butter or oil, sauce off)
        note:
          type: string
          description: Optional caution or tip (portion boxing, double-checks)
      required:
        - name
        - howToOrder
    CoachMenuScanAvoidItem:
      type: object
      properties:
        name:
          type: string
          description: Dish name as printed on the menu
        reason:
          type: string
          description: Short plain-language reason the dish does not fit
      required:
        - name
        - reason
    CoachMenuScanResult:
      type: object
      description: >-
        AI guidance derived from the photo — not official program copy.
        "ok" carries the dish lists; "not_menu" and "unreadable" explain the
        problem in message and carry empty lists.
      properties:
        result:
          type: string
          enum: [ok, not_menu, unreadable]
        message:
          type: string
          description: Short coach-voice summary or explanation
        menuTitle:
          type: string
          description: Restaurant or menu name when printed on the menu
        order:
          type: array
          items:
            $ref: "#/components/schemas/CoachMenuScanOrderItem"
        avoid:
          type: array
          items:
            $ref: "#/components/schemas/CoachMenuScanAvoidItem"
      required:
        - result
        - message
        - order
        - avoid
    CoachLabelScanInput:
      type: object
      properties:
        image:
          type: string
          description: >-
            Nutrition Facts photo as a base64 data URI (image/jpeg, image/png,
            or image/webp), downscaled and compressed client-side before
            upload.
          maxLength: 8000000
      required:
        - image
    CoachLabelScanLabel:
      type: object
      description: >-
        Validated per-serving transcription of one Nutrition Facts panel —
        the same read the coach chat's labelDraft SSE event carries. Printed
        values only; optional fields are omitted when the panel does not
        print them legibly.
      properties:
        id:
          type: string
          description: Server-issued draft id ("label_...")
        servingSize:
          type: string
          description: Printed serving size line, e.g. "2/3 cup (55g)"
        servingsPerContainer:
          type: number
          description: Printed container count; omitted when not printed
        calories:
          type: number
          description: Calories per serving as printed
        protein:
          type: number
          description: Grams per serving
        carbs:
          type: number
          description: Grams per serving
        fat:
          type: number
          description: Grams per serving
        fiber:
          type: number
          description: Grams per serving; omitted when not printed legibly
        sugar:
          type: number
          description: Grams per serving; omitted when not printed legibly
        sodium:
          type: number
          description: Milligrams per serving; omitted when not printed legibly
        suggestedSlot:
          type: string
          enum: [breakfast, lunch, dinner, snacks]
          description: Diary slot a chat food card would preselect; advisory here
        flagged:
          type: boolean
          description: >-
            Printed calories disagree wildly with the 4/4/9 macro math
            (misprint or misread) — worth a double check of the package
      required:
        - id
        - servingSize
        - calories
        - protein
        - carbs
        - fat
        - suggestedSlot
    CoachLabelScanResult:
      type: object
      description: >-
        "ok" carries the transcribed label; "not_label" and "unreadable"
        explain the problem in message and carry no label. An illegible
        required value makes the whole shot "unreadable" — values are never
        estimated.
      properties:
        result:
          type: string
          enum: [ok, not_label, unreadable]
        message:
          type: string
          description: >-
            Coach-voice reaction (ok) or warm retake nudge (not_label /
            unreadable); may contain blank-line paragraph breaks
        label:
          $ref: "#/components/schemas/CoachLabelScanLabel"
      required:
        - result
        - message
    TrainingUploadUrlInput:
      type: object
      properties:
        fileName:
          type: string
          maxLength: 300
          description: Original file name, for logs and error copy only
        contentType:
          type: string
          maxLength: 100
          description: MIME type the browser will send on the PUT (video/mp4, video/webm, video/quicktime)
        sizeBytes:
          type: number
          minimum: 1
          maximum: 524288000
          description: File size in bytes; the hard cap is 500 MB
      required:
        - fileName
        - contentType
        - sizeBytes
    TrainingUploadUrlResult:
      type: object
      properties:
        uploadUrl:
          type: string
          description: Presigned PUT URL, valid for ~15 minutes
        objectPath:
          type: string
          description: Canonical object path to send to finalize; never a URL
      required:
        - uploadUrl
        - objectPath
    TrainingThumbnailUploadUrlInput:
      type: object
      properties:
        fileName:
          type: string
          maxLength: 300
          description: Original file name, for browser metadata only
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: MIME type sent on the presigned PUT
        sizeBytes:
          type: number
          minimum: 1
          maximum: 10485760
          description: File size in bytes; the hard cap is 10 MB
      required:
        - fileName
        - contentType
        - sizeBytes
    TrainingThumbnailUploadUrlResult:
      type: object
      properties:
        uploadUrl:
          type: string
          description: Presigned PUT URL, valid for about 15 minutes
        objectPath:
          type: string
          description: Canonical object path to send to thumbnail finalize
        videoSource:
          type: string
          description: Current hosted-video object path; send back to finalize
      required:
        - uploadUrl
        - objectPath
        - videoSource
    TrainingThumbnailFinalizeInput:
      type: object
      properties:
        objectPath:
          type: string
          maxLength: 500
          description: The object path returned by thumbnail-upload-url
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: MIME type declared on the upload
        videoSource:
          type: string
          maxLength: 500
          description: Video source revision returned by thumbnail-upload-url
      required:
        - objectPath
        - contentType
        - videoSource
    TrainingFinalizeInput:
      type: object
      properties:
        objectPath:
          type: string
          maxLength: 500
          description: The object path returned by upload-url after the PUT succeeded
      required:
        - objectPath
    TrainingFinalizeResult:
      type: object
      properties:
        videoSource:
          type: string
          description: Object path now stored on the video row
        durationSeconds:
          type: number
          description: Duration probed from the file (rounded seconds)
        thumbnailSource:
          type: ["string", "null"]
          description: >-
            Object path of the automatically captured first-frame thumbnail;
            null when the capture failed (the upload itself still succeeded)
      required:
        - videoSource
        - durationSeconds
        - thumbnailSource
    TrainingRemoveFileResult:
      type: object
      properties:
        removed:
          type: boolean
      required:
        - removed
    TrainingMediaResult:
      type: object
      properties:
        videoUrl:
          type: string
          description: Signed GET URL for the video file; supports range requests
        thumbnailUrl:
          type: ["string", "null"]
          description: Signed GET URL for the captured thumbnail, when one exists
        expiresAtMs:
          type: number
          description: Epoch milliseconds after which these URLs stop working
      required:
        - videoUrl
        - thumbnailUrl
        - expiresAtMs
    TrainingTranscriptSegment:
      type: object
      properties:
        at:
          type: number
          description: Segment start in seconds from the top of the video
        end:
          type: number
          description: Segment end in seconds
        text:
          type: string
      required:
        - at
        - end
        - text
    TrainingTranscriptResult:
      type: object
      properties:
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TrainingTranscriptSegment"
      required:
        - segments
    TrainingThumbnailInput:
      type: object
      properties:
        atSeconds:
          type: number
          minimum: 0
          maximum: 86400
          description: Video time of the frame to capture, clamped to the duration
      required:
        - atSeconds
    TrainingThumbnailResult:
      type: object
      properties:
        thumbnailSource:
          type: string
          description: Object path now stored on the video row
        thumbnailUrl:
          type: string
          description: Signed GET URL for immediate display
      required:
        - thumbnailSource
        - thumbnailUrl
    TrainingProcessInput:
      type: object
      properties:
        steps:
          type: array
          maxItems: 4
          description: >-
            Subset of steps to run, in pipeline order; omit for the full pass.
            Used by retries to resume from a failed step without re-spending
            the ones that succeeded.
          items:
            type: string
            enum: [transcribe, describe, chapters, thumbnail]
    KnowledgeUploadUrlInput:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 300
          description: Original file name; becomes the document title (sans extension)
        contentType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - text/plain
            - text/markdown
          description: Canonical MIME type the browser will send on the PUT
        sizeBytes:
          type: number
          minimum: 1
          maximum: 26214400
          description: File size in bytes; the hard cap is 25 MB
      required:
        - fileName
        - contentType
        - sizeBytes
    KnowledgeUploadUrlResult:
      type: object
      properties:
        documentId:
          type: string
          description: Id the object path is bound to; send back to the create call
        uploadUrl:
          type: string
          description: Presigned PUT URL, valid for ~15 minutes
        objectPath:
          type: string
          description: Canonical object path to send back after the PUT; never a URL
      required:
        - documentId
        - uploadUrl
        - objectPath
    KnowledgeCreateInput:
      type: object
      properties:
        documentId:
          type: string
          maxLength: 60
          description: The id returned by upload-url
        objectPath:
          type: string
          maxLength: 500
          description: The object path returned by upload-url after the PUT succeeded
        fileName:
          type: string
          minLength: 1
          maxLength: 300
        contentType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - text/plain
            - text/markdown
      required:
        - documentId
        - objectPath
        - fileName
        - contentType
    KnowledgeReplaceInput:
      type: object
      properties:
        objectPath:
          type: string
          maxLength: 500
          description: The object path returned by the replace upload-url
        fileName:
          type: string
          minLength: 1
          maxLength: 300
        contentType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - text/plain
            - text/markdown
      required:
        - objectPath
        - fileName
        - contentType
    KnowledgeRenameInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - title
    KnowledgeDocument:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        originalFilename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: number
        status:
          type: string
          enum: [uploaded, extracting, ready, failed]
        errorMessage:
          type: ["string", "null"]
          description: Plain-words reason when status is failed
        summary:
          type: ["string", "null"]
          description: Short routing summary written at extraction time
        keywords:
          type: array
          items:
            type: string
          description: Routing keywords written at extraction time
        extractedChars:
          type: number
          description: Length of the extracted text; 0 until status is ready
        createdAt:
          type: string
          description: ISO timestamp
        updatedAt:
          type: string
          description: ISO timestamp
      required:
        - id
        - title
        - originalFilename
        - contentType
        - sizeBytes
        - status
        - errorMessage
        - summary
        - keywords
        - extractedChars
        - createdAt
        - updatedAt
    KnowledgeDocumentDetail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        originalFilename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: number
        status:
          type: string
          enum: [uploaded, extracting, ready, failed]
        errorMessage:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        keywords:
          type: array
          items:
            type: string
        extractedChars:
          type: number
        extractedText:
          type: ["string", "null"]
          description: Full extracted text; null until status is ready
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - originalFilename
        - contentType
        - sizeBytes
        - status
        - errorMessage
        - summary
        - keywords
        - extractedChars
        - extractedText
        - createdAt
        - updatedAt
    KnowledgeDocumentList:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeDocument"
      required:
        - documents
    KnowledgeDeleteResult:
      type: object
      properties:
        deleted:
          type: boolean
      required:
        - deleted
    KnowledgeExtractResult:
      type: object
      properties:
        status:
          type: string
          enum: [extracting]
      required:
        - status
  parameters:
    TrainingVideoId:
      name: videoId
      in: path
      required: true
      description: UUID of the training video row
      schema:
        type: string
    KnowledgeDocumentId:
      name: documentId
      in: path
      required: true
      description: UUID of the knowledge document row
      schema:
        type: string
