      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfficeConversationStartInput" }
      responses:
        "200":
          description: Existing or newly created care-team conversation
          content: { application/json: { schema: { $ref: "#/components/schemas/ConversationStartResult" } } }
