openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: coach
    description: AI coach chat for patients
  - name: barcode
    description: >-
      Packaged-food lookup by barcode. The server answers from the shared
      nutrition-facts table when any earlier scan already saved the product
      and only queries Open Food Facts on a miss, so the provider can be
      swapped without touching the app.
  - name: catalog
    description: >-
      Authenticated food-catalog search and selection. Shared rows are
      service-role only; a patient's private foods are visible only to them.
  - name: training
    description: >-
      Hosted training-video media. Callers authenticate with their existing
      Supabase staff session (Authorization: Bearer <access token>); HQ admins
      manage files and run AI processing, provider staff fetch playback URLs.
  - name: knowledge
    description: >-
      AI Support knowledge base. HQ admins upload PDF / Word / text documents;
      the server verifies each upload in App Storage, extracts the full text,
      and stores it with a short summary + keywords for answer routing. Same
      auth model as training: the caller's existing Supabase staff session
      rides as a bearer token and is re-verified on every call.
  - name: support
    description: >-
      AI Support chat for provider offices. Answers come only from the
      HQ-uploaded knowledge documents, in a comprehensive, formatted style.
  - name: progress-photos
    description: >-
      Guided progress photo storage for patients. The app compresses each
      shot on-device, uploads it straight to App Storage via a presigned
      PUT, and finalize verifies the stored bytes before the app keeps the
      object path. Grid reads redirect to short-lived signed URLs. Demo
      posture: no sign-in; writes are rate limited per IP.
  - name: bloodwork
    description: Private patient bloodwork reports and unreviewed structured transcription.
paths:
  /support/chat:
    post:
      operationId: supportChat
      tags: [support]
      summary: Stream an AI Support reply for a provider office chat turn
      description: >-
        Stateless SSE endpoint mirroring the coach chat contract, text only.
        The client sends its in-session message history and receives a
        text/event-stream of assistant chunks
        ("data: {\"content\": \"...\"}" lines followed by
        "data: {\"done\": true}"); a failed turn ends with one
        "data: {\"error\": \"...\"}" event instead of done. Replies are
        grounded exclusively in the ready knowledge documents: the server
        first sends the best-matching documents, and silently broadens to the
        whole library when the model signals those cannot answer. Answers are
        markdown-formatted (headers, bullets, bold, emojis). Rate limits
        apply, with knobs separate from the patient coach.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportChatInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid request body
        "429":
          description: Rate limited
  /coach/chat:
    post:
      operationId: coachChat
      tags: [coach]
      summary: Stream an AI coach reply for a patient chat turn
      description: >-
        Stateless SSE endpoint. The client sends its in-session message history
        and receives a text/event-stream of assistant chunks
        ("data: {\"content\": \"...\"}" lines followed by
        "data: {\"done\": true}"), optionally with one
        "data: {\"card\": {\"kind\", \"payload\"}}" event before done.
        A photo turn sent without photoKind is triaged server-side and the
        resolved route is announced early as one
        "data: {\"photoKind\": \"menu\"|\"meal\"|\"label\"}" event, so a
        client retry of that turn can name the same route explicitly.
        Card kinds: "product" — a curated THINNR product suggestion
        ({\"id\", \"name\", \"line\", \"price\"}); "recipe" — a structured
        recipe suggestion emitted on meal-idea and craving turns, whose
        ingredients in cravings mode are validated server-side against the
        official Approved Foods list. A nutrition label photo turn also
        emits one "data: {\"labelDraft\": {...}}" event before done — the
        validated per-serving read (servingSize, servingsPerContainer,
        calories, protein, carbs, fat, optional fiber/sugar/sodium,
        suggestedSlot, flagged) that the client holds through the follow-up
        name conversation; clients that predate it ignore the event. Patient
        program context is derived server-side from the demo seed; rate
        limits apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachChatInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid request body
        "429":
          description: Rate limited
        "503":
          description: >-
            The care team has paused the coach (organization policy). JSON
            body {"error", "retryable": false, "coachPaused": true}. Only
            real patient sessions are paused; the demo persona is unaffected.
  /coach/availability:
    get:
      operationId: getCoachAvailability
      tags: [coach]
      summary: Whether the AI coach is currently available to this patient
      description: >-
        Reads the HQ coach-availability policy. Unauthenticated (demo) callers
        are always available; a real patient session answers the live policy
        so the app can show an honest "coach paused by your care team" state
        before the patient types.
      responses:
        "200":
          description: Availability
          content: { application/json: { schema: { $ref: "#/components/schemas/CoachAvailability" } } }
  /coach/recipe-image:
    post:
      operationId: coachRecipeImage
      tags: [coach]
      summary: Generate a dish photo for an AI-suggested recipe
      description: >-
        Generates a single appetizing dish photo for a coach recipe suggestion
        and returns it as a JPEG data URI, small enough for the client to
        persist alongside a saved recipe. Rate limited separately from chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachRecipeImageInput"
      responses:
        "200":
          description: Generated photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachRecipeImageResult"
        "400":
          description: Invalid request body
        "429":
          description: Rate limited
        "502":
          description: Image generation failed
  /coach/menu-scan:
    post:
      operationId: coachMenuScan
      tags: [coach]
      summary: Scan a restaurant menu photo for THINNR-compatible orders
      description: >-
        Analyzes one menu photo with the coach's vision model, grounded in the
        verbatim Approved Foods list and the restaurant guide's ordering
        rules, and returns structured AI guidance: dishes on that menu that
        can work (each with the exact modification to request), dishes to
        avoid, or a signal that the photo is not a readable menu. The photo is
        analyzed in memory only and never stored server-side. This route
        accepts a larger JSON body than the rest of the API (photo payload)
        and is rate limited separately from chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachMenuScanInput"
      responses:
        "200":
          description: Structured scan result (AI guidance, not program copy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachMenuScanResult"
        "400":
          description: Invalid request body or unsupported photo format
        "413":
          description: Photo payload too large
        "429":
          description: Rate limited
        "502":
          description: Menu scan failed
  /coach/label-scan:
    post:
      operationId: coachLabelScan
      tags: [coach]
      summary: Read a Nutrition Facts photo into per-serving values
      description: >-
        Runs the same nutrition-label reader as the coach chat's label photo
        turns — transcription only, never estimates — and returns the
        validated per-serving read directly, for non-chat surfaces like the
        create-food screen. "ok" carries the label values; "not_label" and
        "unreadable" explain the problem in message (coach-voiced, warm,
        ending with the same retake nudge the chat uses) and carry no label,
        because nothing is ever guessed. The photo is analyzed in memory only
        and never stored server-side. This route accepts a larger JSON body
        than the rest of the API (photo payload) and shares the photo-scan
        rate budget with menu scans and chat photo turns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachLabelScanInput"
      responses:
        "200":
          description: Structured label read (transcribed values, no estimates)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachLabelScanResult"
        "400":
          description: Invalid request body or unsupported photo format
        "413":
          description: Photo payload too large
        "429":
          description: Rate limited
        "502":
          description: Label scan failed
  /barcode/{code}:
    get:
      operationId: barcodeLookup
      tags: [barcode]
      summary: Look up a packaged food's per-serving nutrition by barcode
      description: >-
        Validates the code (UPC/EAN digit variants; UPC-A is normalized to
        its 13-digit form), answers from the shared nutrition-facts table
        when any earlier scan saved the product, and only on a miss queries
        Open Food Facts, saving the normalized result for every later scan.
        Per-IP rate limited like the other open demo routes.
      parameters:
        - name: code
          in: path
          required: true
          description: >-
            Barcode as typed or scanned - 8, 12, 13, or zero-led 14 digits;
            spaces and hyphens are tolerated
          schema:
            type: string
            minLength: 8
            maxLength: 24
      responses:
        "200":
          description: >-
            Lookup outcome: found with facts, or not_found with an honest
            message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeLookupResult"
        "400":
          description: Not a UPC/EAN style barcode
        "429":
          description: Rate limited
        "502":
          description: The nutrition database is unreachable right now
  /catalog/search:
    get:
      operationId: catalogSearch
      tags: [catalog]
      summary: Search shared and patient-private foods
      description: >-
        Signed-out callers receive shared local foods only. Authenticated
        patients also receive private foods ranked with their selection history;
        sufficiently specific text (or branded=true) may append validated Open
        Food Facts products. External products are not persisted until selected.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: branded
          in: query
          description: Explicitly request guarded branded fallback
          schema: { type: boolean, default: false }
        - name: grouped
          in: query
          description: >-
            Enable reviewed family grouping, deterministic paging, and the
            bounded small-choice response. When absent, legacy search behavior
            is preserved.
          schema: { type: boolean }
        - name: intent
          in: query
          description: Search generic/basic foods or explicitly packaged products
          schema: { type: string, enum: [basic, packaged], default: basic }
        - name: approvedOnly
          in: query
          description: Restrict candidates to variations with an eligible approval
          schema: { type: boolean, default: false }
        - name: cursor
          in: query
          description: Opaque continuation cursor returned by a grouped search
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        "200":
          description: Ranked local results followed by any external results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSearchResult" }
        "400": { description: Invalid query }
        "403": { description: Session is not linked to a patient }
        "429": { description: Rate limited }
        "502": { description: Local catalog is unavailable }
  /catalog/families/{familyKey}:
    get:
      operationId: catalogFamily
      tags: [catalog]
      summary: Get every eligible reviewed variation in a food family
      description: >-
        Returns complete source-specific configurations. Family grouping never
        merges nutrient values or replaces the exact catalog identity.
      security: []
      parameters:
        - name: familyKey
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: approvedOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Ordered eligible family variations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogFamilyResult" }
        "400": { description: Invalid family key }
        "403": { description: Session is not linked to a patient }
        "404": { description: Reviewed family not found }
        "429": { description: Rate limited }
        "502": { description: Local catalog is unavailable }
  /catalog/selections:
    post:
      operationId: catalogSelect
      tags: [catalog]
      summary: Record a food selection and promote a selected branded product
      description: >-
        Records patient-scoped popularity for shared foods. For an external
        off:{barcode} result, re-fetches and validates the authoritative
        product, then idempotently upserts both the shared catalog and legacy
        barcode cache. Private custom foods remain private and are never
        promoted.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogSelectionInput" }
      responses:
        "200":
          description: Selected canonical id and food
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSelectionResult" }
        "400": { description: Invalid selection id }
        "401": { description: Missing or expired patient session }
        "403": { description: Session is not linked to a patient }
        "404": { description: Product no longer exists }
        "422": { description: External product has incomplete nutrition }
        "429": { description: Rate limited }
        "502": { description: Selection could not be persisted }
  /progress-photos/file:
    get:
      operationId: progressPhotoFile
      tags: [progress-photos]
      summary: Redirect to a short-lived signed URL for a legacy stored photo
      description: >-
        Open read for photos the retired anonymous rail stored under the
        progress-photos prefix (pre-account demo grids still reference
        them): the grid points image tags here and the server 302-redirects
        to a signed GET valid for about an hour. Only paths under the
        progress-photos prefix resolve, so this cannot leak other stored
        objects. New progress photos upload authenticated on the
        per-patient media rail and read via /patient-media/file.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 500
          description: Canonical object path returned by finalize
      responses:
        "302":
          description: Redirect to the signed download URL
        "400":
          description: Not a progress-photos object path
        "404":
          description: No such stored photo
  /training/videos/{videoId}/upload-url:
    post:
      operationId: trainingVideoUploadUrl
      tags: [training]
      summary: Mint a presigned upload URL for a training video file
      description: >-
        HQ admins only. Returns a short-lived presigned PUT URL so the browser
        uploads the file straight to App Storage (the API never proxies the
        body), plus the canonical object path to send back to finalize.
        Nothing is written to the video row until finalize verifies the bytes.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingUploadUrlInput"
      responses:
        "200":
          description: Presigned PUT URL and the object path it creates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingUploadUrlResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "413":
          description: File exceeds the 500 MB limit
        "415":
          description: Not an accepted video container (MP4/WebM/MOV)
  /training/videos/{videoId}/video:
    post:
      operationId: trainingVideoFinalize
      tags: [training]
      summary: Attach an uploaded file to the video after verifying it
      description: >-
        HQ admins only. Verifies the uploaded object exists under this video's
        prefix, ffprobes it (authoritative duration and playability check),
        persists the object path and duration, clears the previous file's
        transcript/thumbnail, and deletes the replaced object. Then captures
        the first frame as the thumbnail automatically — a capture failure is
        non-fatal and reported as thumbnailSource null. Stores only object
        paths — playback URLs are minted per request.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingFinalizeInput"
      responses:
        "200":
          description: The file is now this lesson's hosted video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingFinalizeResult"
        "400":
          description: Invalid body or object path outside this video's prefix
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: Video row or uploaded object not found
        "413":
          description: File exceeds the 500 MB limit
        "422":
          description: The bytes are not a playable video
    delete:
      operationId: trainingVideoRemoveFile
      tags: [training]
      summary: Remove the hosted file (the lesson row stays)
      description: >-
        HQ admins only. Clears the video's hosted file, thumbnail, and
        transcript, and deletes the stored objects. The lesson itself keeps
        its metadata and returns to the simulated-slides experience.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      responses:
        "200":
          description: Hosted file removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingRemoveFileResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "409":
          description: There is no hosted file to remove
  /training/videos/{videoId}/thumbnail-upload-url:
    post:
      operationId: trainingThumbnailUploadUrl
      tags: [training]
      summary: Mint a presigned upload URL for a custom lesson thumbnail
      description: >-
        HQ admins only. Returns a short-lived presigned PUT URL for a JPG, PNG,
        or WebP thumbnail plus the current video source revision. The revision
        is sent to finalize so a thumbnail upload cannot land on a replacement
        video.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingThumbnailUploadUrlInput"
      responses:
        "200":
          description: Presigned PUT URL and the current video revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingThumbnailUploadUrlResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "409":
          description: No hosted video
        "413":
          description: File exceeds the 10 MB limit
        "415":
          description: Not an accepted image type (JPG/PNG/WebP)
  /training/videos/{videoId}/thumbnail-upload:
    post:
      operationId: trainingThumbnailUpload
      tags: [training]
      summary: Validate and attach a custom lesson thumbnail
      description: >-
        HQ admins only. Verifies the uploaded object belongs to this video,
        checks its size, MIME declaration, and image signature/dimensions, then
        replaces the prior thumbnail safely. The supplied video source revision
        prevents an upload started before a video replacement from becoming
        the cover of the new video.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingThumbnailFinalizeInput"
      responses:
        "200":
          description: Custom thumbnail attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingThumbnailResult"
        "400":
          description: Invalid body or object path outside this video's thumbnail prefix
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: Video row or uploaded object not found
        "409":
          description: No hosted video or the video changed during upload
        "413":
          description: File is empty or exceeds the 10 MB limit
        "422":
          description: Uploaded bytes are not a valid JPG, PNG, or WebP
  /training/videos/{videoId}/attachment-upload-url:
    post:
      operationId: trainingAttachmentUploadUrl
      tags: [training]
      summary: Mint a presigned upload URL for a lesson attachment file
      description: >-
        HQ admins only. Returns a short-lived presigned PUT URL for a
        worksheet, document, spreadsheet, presentation, text, or image
        attachment, plus the canonical object path to send back to the
        attachment finalize call. Attachment objects live under a dedicated
        training-attachments prefix — never mixed into the hosted-video
        folder. Nothing is written to the video row until finalize verifies
        the uploaded bytes.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAttachmentUploadUrlInput"
      responses:
        "200":
          description: Presigned PUT URL and the object path it creates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingUploadUrlResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "409":
          description: The lesson already has the maximum number of attachments
        "413":
          description: File exceeds the 25 MB limit
        "415":
          description: Not an accepted attachment type (PDF, Word, Excel, PowerPoint, text, CSV, or image)
  /training/videos/{videoId}/attachments:
    post:
      operationId: trainingAttachmentFinalize
      tags: [training]
      summary: Attach an uploaded file to the lesson after verifying it
      description: >-
        HQ admins only. Verifies the uploaded object exists under this
        video's attachments prefix, re-checks the size cap and allow-listed
        content type against the stored bytes (a failed check deletes the
        stray object), stamps a download disposition so the file always
        saves under its real name, then appends the attachment entry — name,
        content type, true byte size, object path — to the video row's
        attachment list. Stores only object paths; download URLs are minted
        per request.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingAttachmentFinalizeInput"
      responses:
        "200":
          description: The attachment is now stored on the lesson row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingAttachmentFinalizeResult"
        "400":
          description: Invalid body or object path outside this video's attachments prefix
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: Video row or uploaded object not found
        "409":
          description: Attachment limit reached, or the lesson changed while attaching
        "413":
          description: Stored file is empty or exceeds the 25 MB limit
        "415":
          description: Declared content type is not accepted
        "422":
          description: Stored bytes don't match the declared content type
    delete:
      operationId: trainingAttachmentsClear
      tags: [training]
      summary: Remove every attachment and its stored file
      description: >-
        HQ admins only. Deletes each hosted attachment object and empties
        the lesson's attachment list in one pass — the video-deletion flow
        calls this first so removing the row never orphans stored files.
        Legacy name-only entries are cleared with no storage work.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      responses:
        "200":
          description: All attachments removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingAttachmentsClearResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "409":
          description: The lesson changed while clearing attachments
  /training/videos/{videoId}/attachments/{attachmentId}:
    delete:
      operationId: trainingAttachmentRemove
      tags: [training]
      summary: Remove one attachment (and its stored file)
      description: >-
        HQ admins only. Drops the entry from the video row's attachment
        list, then deletes the hosted object when the entry has one. Legacy
        name-only entries are removed without any storage work.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
        - $ref: "#/components/parameters/TrainingAttachmentId"
      responses:
        "200":
          description: Attachment removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingAttachmentRemoveResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video or attachment
        "409":
          description: The lesson changed while removing the attachment
  /training/videos/{videoId}/attachments/{attachmentId}/download-url:
    get:
      operationId: trainingAttachmentDownloadUrl
      tags: [training]
      summary: Short-lived signed download URL for a lesson attachment
      description: >-
        HQ admins, provider staff, and the learner preview. Mints a fresh
        signed GET URL for the attachment's stored file — links are
        short-lived, so clients request one per download click instead of
        persisting URLs; that is what keeps downloads working after reloads
        and in other browsers. Legacy name-only entries have no file and
        answer 404.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
        - $ref: "#/components/parameters/TrainingAttachmentId"
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingAttachmentDownloadResult"
        "404":
          description: Video, attachment, or hosted file not found
  /training/videos/{videoId}/media:
    get:
      operationId: trainingVideoMedia
      tags: [training]
      summary: Short-lived signed playback URLs for a hosted video
      description: >-
        HQ admins and provider staff. Returns signed GET URLs for the video
        file (and thumbnail when one exists) so the <video> element's range
        requests hit storage directly — that is what makes seeking work. URLs
        expire; clients re-request rather than persist them.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      responses:
        "200":
          description: Signed playback URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingMediaResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not staff
        "404":
          description: Video row missing or no file hosted
  /training/videos/{videoId}/transcript:
    get:
      operationId: trainingVideoTranscript
      tags: [training]
      summary: Timed transcript of the hosted video
      description: >-
        HQ admins only (the editor's transcript viewer). Segments follow the
        transcription grid — near-minute slices with start/end seconds.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      responses:
        "200":
          description: Timed transcript segments in playback order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingTranscriptResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: Video row missing or no transcript yet
  /training/videos/{videoId}/thumbnail:
    post:
      operationId: trainingVideoThumbnail
      tags: [training]
      summary: Capture a video frame as the lesson thumbnail
      description: >-
        HQ admins only. The editor's thumbnail dialog scrubs the real video
        client-side, then sends the chosen time; the server extracts that
        frame with ffmpeg, stores it, and replaces the previous thumbnail.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingThumbnailInput"
      responses:
        "200":
          description: Thumbnail captured and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingThumbnailResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "409":
          description: No hosted video to capture from
  /training/videos/{videoId}/process:
    post:
      operationId: trainingVideoProcess
      tags: [training]
      summary: Run the AI pass over the hosted video (SSE progress)
      description: >-
        HQ admins only; one run per video at a time. Streams step-by-step
        progress as SSE "data:" JSON lines — {"step", "status":
        "running"|"done"|"failed"|"skipped", ...payload} with comment
        keepalives — and ends with {"done": true, "ok": boolean}. Steps in
        order: "transcribe" (audio → timed segments, saved server-side),
        "describe" (model writes catalog paragraphs from the transcript),
        "chapters" (model picks chapter starts on the transcription grid),
        "thumbnail" (first frame captured and stored). Each step persists on
        success immediately; a failed step reports plainly and later runs can
        retry just the remaining steps via "steps". Description/chapters are
        skipped when transcription fails in the same run.
      parameters:
        - $ref: "#/components/parameters/TrainingVideoId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingProcessInput"
      responses:
        "200":
          description: SSE stream of step progress events
          content:
            text/event-stream: {}
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such training video
        "409":
          description: No hosted video, or a run is already in progress
  /knowledge/upload-url:
    post:
      operationId: knowledgeUploadUrl
      tags: [knowledge]
      summary: Mint a presigned upload URL for a new knowledge document
      description: >-
        HQ admins only. Validates the declared type and size, mints a fresh
        document id, and returns a short-lived presigned PUT URL plus the
        canonical object path bound to that id
        (/objects/knowledge-docs/<documentId>/…). Nothing is written to the
        database until the create call verifies the uploaded bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUploadUrlInput"
      responses:
        "200":
          description: Presigned PUT URL, the new document id, and its object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUploadUrlResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "413":
          description: File exceeds the 25 MB limit
        "415":
          description: Not an accepted document type (PDF, Word .docx, text, Markdown)
  /knowledge/documents:
    get:
      operationId: knowledgeListDocuments
      tags: [knowledge]
      summary: List every knowledge document (without extracted text)
      description: >-
        HQ admins only. Returns all documents newest-first with status,
        summary, and keyword metadata — extracted text stays out of the list
        payload and is fetched per document.
      responses:
        "200":
          description: All knowledge documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentList"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
    post:
      operationId: knowledgeCreateDocument
      tags: [knowledge]
      summary: Create the document after verifying the uploaded bytes
      description: >-
        HQ admins only. Verifies the uploaded object exists under the minted
        document id's prefix and respects the size cap, inserts the document
        row, and starts text extraction in the background. The response
        returns immediately; clients poll the list or detail endpoint while
        status moves uploaded → extracting → ready or failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeCreateInput"
      responses:
        "200":
          description: The created document, extraction underway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          description: Invalid body or object path outside the document's prefix
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: The uploaded object never arrived
        "409":
          description: That document id already exists
        "413":
          description: File exceeds the 25 MB limit
        "415":
          description: Not an accepted document type
        "422":
          description: The uploaded file is empty
  /knowledge/documents/{documentId}:
    get:
      operationId: knowledgeGetDocument
      tags: [knowledge]
      summary: Fetch one document including its extracted text
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      responses:
        "200":
          description: The document with extracted text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentDetail"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such knowledge document
    patch:
      operationId: knowledgeRenameDocument
      tags: [knowledge]
      summary: Rename a document (its stored file is untouched)
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeRenameInput"
      responses:
        "200":
          description: The renamed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          description: Invalid title
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such knowledge document
    delete:
      operationId: knowledgeDeleteDocument
      tags: [knowledge]
      summary: Delete a document and its stored file
      description: >-
        HQ admins only. Deletes the stored object from App Storage and then
        removes the row — extracted text, summary, and keywords go with it.
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDeleteResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such knowledge document
  /knowledge/documents/{documentId}/upload-url:
    post:
      operationId: knowledgeReplaceUploadUrl
      tags: [knowledge]
      summary: Mint a presigned upload URL to replace a document's file
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUploadUrlInput"
      responses:
        "200":
          description: Presigned PUT URL and object path under this document's prefix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeUploadUrlResult"
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such knowledge document
        "413":
          description: File exceeds the 25 MB limit
        "415":
          description: Not an accepted document type
  /knowledge/documents/{documentId}/file:
    post:
      operationId: knowledgeReplaceFile
      tags: [knowledge]
      summary: Swap in a replacement file after verifying it
      description: >-
        HQ admins only. Verifies the uploaded object under this document's
        prefix, clears the old extracted text / summary / keywords (they
        described the OLD file), swaps the stored object path in one
        conditional write, deletes the replaced object, and re-runs
        extraction on the new bytes.
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeReplaceInput"
      responses:
        "200":
          description: The document with the replacement file, extraction underway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          description: Invalid body or object path outside this document's prefix
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: Document row or uploaded object not found
        "409":
          description: The document changed while finalizing — upload again
        "413":
          description: File exceeds the 25 MB limit
        "415":
          description: Not an accepted document type
        "422":
          description: The uploaded file is empty
  /knowledge/documents/{documentId}/extract:
    post:
      operationId: knowledgeRetryExtraction
      tags: [knowledge]
      summary: Re-run text extraction on the stored file
      description: >-
        HQ admins only. Re-reads the stored object and runs extraction again —
        the retry for failed documents (also unsticks a document left in
        "extracting" by a server restart). One run per document at a time.
      parameters:
        - $ref: "#/components/parameters/KnowledgeDocumentId"
      responses:
        "202":
          description: Extraction restarted; poll the document for the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeExtractResult"
        "401":
          description: Missing or invalid staff session
        "403":
          description: Caller is not an HQ admin
        "404":
          description: No such knowledge document
        "409":
          description: An extraction run is already in progress
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /patient-coach/conversations:
    get:
      operationId: listPatientCoachConversations
      tags: [coach]
      summary: List the signed-in patient's coach conversations
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false } }
