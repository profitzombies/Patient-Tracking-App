        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientCareTeamMessageInput" }
      responses:
        "200":
          description: Idempotently stored patient message
          content: { application/json: { schema: { $ref: "#/components/schemas/PatientCareTeamMessageResult" } } }
