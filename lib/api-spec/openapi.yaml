      operationId: getOfficeEngagementTrends
      tags: [office]
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, required: true, schema: { type: string, format: date } }
        - $ref: "#/components/parameters/OfficeId"
      responses:
        "200":
          description: Aggregate engagement daily trend
          content: { application/json: { schema: { $ref: "#/components/schemas/EngagementTrendResult" } } }
  /office/leaderboard:
    get:
      operationId: getOfficeLeaderboard
      tags: [office]
      summary: Rank an authorized office's real patients by loss, goal completion and adherence
      description: >-
        Provider staff are always scoped to their own office. HQ names an
        office, or passes office=all for every enabled office at once. Rows
        carry every metric plus a competition rank per metric (ties share);
        patients who cannot be ranked for the period are counted under
        notRankable by reason and never returned as zero-score rows. A live
        failure is a 502 — clients never fall back to seeded data.
      parameters:
        - $ref: "#/components/parameters/OfficeId"
        - { name: period, in: query, schema: { type: string, enum: [program, 30d, 90d], default: program } }
        - { name: stage, in: query, schema: { type: string, enum: [all, protocol, maintenance], default: all } }
      responses:
        "200":
          description: Ranked rows, not-rankable counts and the staff-facing definitions
          content: { application/json: { schema: { $ref: "#/components/schemas/OfficeLeaderboardResult" } } }
        "400": { description: Unknown period or stage or HQ without an office }
        "401": { description: Missing or invalid staff session }
        "403": { description: Not authorized for provider reads }
        "404": { description: Office unavailable }
        "502": { description: The live ranking could not be computed }
  /office/overview:
    get:
      operationId: getOfficeOverview
      tags: [office]
      summary: Read aggregate-only live operational metrics for an authorized office
      parameters:
        - $ref: "#/components/parameters/OfficeId"
      responses:
        "200":
          description: Zero-safe office operational rollup
          content: { application/json: { schema: { $ref: "#/components/schemas/OperationalRollupResult" } } }
        "401": { description: Missing or invalid staff session }
        "403": { description: Not authorized for provider reads }
        "404": { description: Office unavailable }
  /office/conversations:
    get:
      operationId: getOfficeConversations
      tags: [office]
      summary: Staff inbox — filterable, sortable, searchable conversation summaries for an authorized office
      parameters:
        - $ref: "#/components/parameters/OfficeId"
        - { name: channel, in: query, schema: { type: string, enum: [all, care_team, ai], default: all } }
        - { name: patientId, in: query, schema: { type: string } }
        - { name: thread, in: query, schema: { type: string, enum: [coach, support, care_team] } }
        - name: status
          in: query
          schema: { type: string, enum: [open, waiting_patient, closed] }
          description: >-
            Workflow status filter. Threads idle longer than the organization's
            conversation auto-close window (HQ settings) count as closed.
        - { name: assignee, in: query, schema: { type: string, maxLength: 80 }, description: '"me", "unassigned", or a staff user id' }
        - { name: unread, in: query, schema: { type: boolean }, description: "Only conversations with patient messages the caller has not read" }
        - { name: q, in: query, schema: { type: string, maxLength: 120 }, description: "Patient name or message text search" }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, waiting_longest, unread_first], default: newest } }
        - { name: limit, in: query, schema: { type: number, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: number, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Paginated inbox summaries
          content: { application/json: { schema: { $ref: "#/components/schemas/ConversationSummaryResult" } } }
        "404": { description: Office unavailable }
  /office/conversations/start:
    post:
      operationId: startOfficeConversation
      tags: [office]
