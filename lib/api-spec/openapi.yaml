      responses:
        "200":
          description: Range figures plus the daily series (unavailable when the range predates the office data)
          content: { application/json: { schema: { $ref: "#/components/schemas/OfficeAnalyticsResult" } } }
        "400": { description: Invalid range }
        "401": { description: Missing or invalid staff session }
        "403": { description: Not authorized for provider reads }
        "404": { description: Office unavailable }
  /hq/office-comparison:
    get:
      operationId: getHqOfficeComparison
      tags: [hq]
      summary: Per-office operational figures and daily series for a date range
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: One row per enabled office (aggregate only)
          content: { application/json: { schema: { $ref: "#/components/schemas/OfficeComparisonResult" } } }
