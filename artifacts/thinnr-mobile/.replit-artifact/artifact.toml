kind = "mobile"
previewPath = "/thinnr-mobile/"
title = "THINNR Mobile Operations"
description = "A native THINNR Med Spa Operations companion for monitoring synthetic patient progress, practice outcomes, leaderboards, and supplement deliveries with local-only demo workflows."
version = "1.0.0"
id = "artifacts/thinnr-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/thinnr-mobile/" ]
localPort = 19713

[services.development]
run = "pnpm --filter @workspace/thinnr-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thinnr-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/thinnr-mobile", "run", "serve" ]

[services.env]
PORT = "19713"
BASE_PATH = "/thinnr-mobile/"
