kind = "mobile"
previewPath = "/thinnr-mobile/"
title = "THINNR Mobile Operations"
description = "The THINNR mobile app. Patients sign in or accept an office invitation to follow their program, log meals, weight and check-ins, and message their care team. Providers sign in to follow patient progress, practice outcomes, leaderboards, orders and in-person sales."
version = "1.0.0"
id = "artifacts/thinnr-mobile"
router = "expo-domain"

[[services]]
name = "expo"
# Metro's status endpoint is ready before the web bundle exists. Probe the
# browser entry bundle so cold-start consumers do not race its first compile.
ensurePreviewReachable = "/artifacts/thinnr-mobile/node_modules/expo-router/entry.bundle?platform=web&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.routerRoot=app&transform.reactCompiler=true&unstable_transformProfile=hermes-stable"
paths = [ "/thinnr-mobile/" ]
localPort = 19713

[services.development]
run = "pnpm --filter @workspace/thinnr-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thinnr-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/thinnr-mobile", "run", "serve" ]

[services.env]
PORT = "19713"
BASE_PATH = "/thinnr-mobile/"
